        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Delete a webhook endpoint
      tags:
      - Webhook
    get:
      description: Retrieve a single webhook endpoint by its ID.
      operationId: Webhook_GetWebhookEndpoint
      parameters:
      - in: path
        name: webhook_endpoint_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
