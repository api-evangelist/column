              $ref: '#/components/schemas/VerifyWebhookEndpointRequest'
        required: true
      responses:
        '200':
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Verify a webhook endpoint
      tags:
      - Webhook
