          format: date
          type: string
        canceled_before_shipping:
          description: Did the cardholder cancel before the merchandise shipped? Required when the cardholder canceled merchandise that was received.
          type: boolean
        cancellation_date:
          description: When did the cardholder cancel? Required when the cardholder canceled `timeshare` or `other` services, canceled merchandise that was not received, or canceled merchandise before it shipped, and for `properly_canceled` and `attempted_cancellation_within_24_hours` guaranteed reservations.
          format: date
          type: string
        cancellation_method:
          description: How and why did the cardholder cancel? Required when the cardholder canceled `timeshare` or `other` services, canceled merchandise that was not received, or canceled merchandise before it shipped.
          example: The cardholder canceled by email to the merchant's support address.
          maxLength: 10000
          type: string
        cancellation_policy_provided:
          description: Was a cancellation policy provided? Required for merchandise that was not received or was canceled before it shipped, for `guaranteed_reservation` services, and for `timeshare` services canceled more than 14 days after `timeshare_date`.
          type: boolean
        cardholder_attempted_resolution:
          description: Did the cardholder attempt to resolve the dispute with the merchant? Required.
          type: boolean
        cardholder_attempted_return:
          description: Did the cardholder attempt to return the merchandise? Required when the merchandise was not returned.
          type: boolean
        cardholder_canceled:
          description: Did the cardholder cancel? Required for merchandise that was not received and for `timeshare` and `other` services, optional for merchandise that was received, and not used for `guaranteed_reservation` services. Must be true for `other` services.
          type: boolean
        cardholder_received_merchandise:
          description: Did the cardholder receive the merchandise? Required for merchandise.
          type: boolean
        cardholder_returned_merchandise:
          description: Did the cardholder return the merchandise? Required when `cardholder_received_merchandise` is true.
          type: boolean
        guaranteed_reservation_certification:
          allOf:
          - $ref: '#/components/schemas/CardDisputeReservationCertification'
          description: What does the cardholder certify about the guaranteed reservation? Required for `guaranteed_reservation` services.
        merchandise_disposition:
          description: What is the current disposition of the merchandise? Required when a return was attempted.
          example: The cardholder still has the merchandise and can return it on request.
          maxLength: 5000
          type: string
        merchandise_or_services:
          allOf:
          - $ref: '#/components/schemas/CardDisputeMerchandiseOrServices'
          description: Was the canceled purchase merchandise or services? Required.
        merchant_accepted_cancellation:
          description: Did the merchant accept the cancellation? Required when the cardholder canceled `timeshare` or `other` services, or canceled merchandise before it shipped, no more than 15 days before submission.
          type: boolean
        merchant_received_return_date:
          description: When did the merchant receive the returned merchandise? Required when the merchandise was returned.
          format: date
          type: string
        merchant_return_refusal_reason:
          allOf:
          - $ref: '#/components/schemas/CardDisputeReturnRefusalReason'
          description: Why did the merchant not provide or accept a merchandise return? Required when a return was attempted. Must be `refused_return_authorization`, `refused_accept_returned_merchandise` or `advised_not_to_return`.
        order_details:
          description: What did the cardholder purchase? Required for merchandise and for `other` services.
          example: A pair of running shoes ordered from the merchant's website.
          maxLength: 10000
          type: string
        received_or_expected_date:
          description: When did the cardholder receive the merchandise, or when did they expect to receive it? Required for merchandise.
          format: date
          type: string
        resolution_prohibited_by_local_law:
          description: 'Is an attempt to resolve the dispute with the merchant prohibited by local law or regulations? Required when `cardholder_attempted_resolution` is false. Must be true: Visa does not accept a dispute where the cardholder neither attempted resolution nor was prohibited from doing so.'
          type: boolean
        return_attempt_details:
