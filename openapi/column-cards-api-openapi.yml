    RespondCardDisputeRequest:
      properties:
        action:
          allOf:
          - $ref: '#/components/schemas/CardDisputeResponseAction'
          description: The response action to take for the current dispute stage.
        amount:
          description: Partial acceptance amount in smallest currency unit. Required for accept_partial.
          format: int64
          type: integer
        cardholder_name_and_address_mismatch:
          description: Certifies that the cardholder name and address the acquirer presented as compelling evidence do not match your records. Required when declining or partially accepting a fraud pre-arbitration in which the acquirer presented compelling evidence, and rejected for any other response. When `false`, `narrative` is sent to Visa as the explanation of why you are continuing the dispute.
          type: boolean
        compelling_evidence_reviewed_with_cardholder:
          description: Certifies that you contacted the cardholder, reviewed the acquirer's compelling evidence with them, and the cardholder continues to dispute the transaction. Required when declining or partially accepting a fraud pre-arbitration in which the acquirer presented compelling evidence, and rejected for any other response. When `true`, `narrative` is sent to Visa as the explanation of why the cardholder continues to dispute.
          type: boolean
        evidence:
          description: Uploaded document evidence with normalized evidence types.
          items:
            $ref: '#/components/schemas/CardDisputeDocumentEvidenceInput'
          type: array
        evidence_document_ids:
