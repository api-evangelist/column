      type: object
    CardDisputeQualityOfMerchandiseOrServicesReasonDetails:
      properties:
        attempted_return_date:
          description: When did the cardholder attempt to return the merchandise? Required when a return was attempted.
          format: date
          type: string
        cancellation_date:
          description: When did the cardholder cancel the services? Required when the services were canceled.
          format: date
          type: string
        cancellation_method:
          description: How and why did the cardholder cancel the services? Required when the services were canceled.
          example: The cardholder canceled by email to the merchant's support address.
          maxLength: 10000
          type: string
        cardholder_attempted_resolution:
          description: Did the cardholder attempt to resolve the dispute with the merchant? Required.
          type: boolean
        cardholder_attempted_return:
          description: Did the cardholder attempt to return the merchandise? Required when the merchandise was not returned.
          type: boolean
        cardholder_canceled:
          description: Did the cardholder cancel the services? Required for services.
          type: boolean
        cardholder_first_notified_issuer_date:
          description: When did the cardholder first notify the issuer of the dispute? Required when `previous_negotiation_evidence` is true.
          format: date
          type: string
        cardholder_paid_for_work_redone:
          description: Did the cardholder pay to have the work redone? Required for services.
          type: boolean
        cardholder_returned_merchandise:
          description: Did the cardholder return the merchandise? Required for merchandise; ignored for services.
          type: boolean
        food_quality_issue:
          description: Is the dispute about the quality of food received from an eating place or restaurant? Required for services purchased from a merchant with MCC 5812, 5813 or 5814.
          type: boolean
        merchandise_disposition:
          description: What is the current disposition of the merchandise? Required when a return was attempted.
          example: The cardholder still has the merchandise and can return it on request.
          maxLength: 5000
          type: string
        merchandise_or_services:
          allOf:
          - $ref: '#/components/schemas/CardDisputeMerchandiseOrServices'
          description: Was the disputed purchase merchandise or services? Required.
        merchant_accepted_cancellation:
          description: Did the merchant accept the cancellation? Required when the services were canceled no more than 15 days before submission.
          type: boolean
        merchant_received_return_date:
          description: When did the merchant receive the returned merchandise? Required when the merchandise was returned.
          format: date
          type: string
        merchant_return_refusal_reason:
          allOf:
          - $ref: '#/components/schemas/CardDisputeReturnRefusalReason'
          description: Why did the merchant not provide or accept a merchandise return? Required when a return was attempted.
        negotiation_details:
          description: What were the previous ongoing negotiations between the cardholder and the merchant? Required when `previous_negotiation_evidence` is true.
          example: The cardholder emailed the merchant twice asking for a refund and received no response.
          maxLength: 10000
          type: string
        negotiation_start_date:
          description: When did the negotiations begin? Required when `previous_negotiation_evidence` is true.
          format: date
          type: string
        non_fiat_currency_not_as_described:
          description: Was the purchase of non-fiat currency or non-fungible tokens (NFTs), and did what the cardholder received not match the description at the time of the transaction? Required for services.
          type: boolean
        order_details:
          description: What did the cardholder purchase, and what is the quality issue? Required.
          example: A pair of running shoes ordered from the merchant's website.
          maxLength: 10000
          type: string
        previous_negotiation_evidence:
          description: Is there evidence of previous ongoing negotiations between the cardholder and the merchant? Required when both `received_date` and the transaction's processing date are more than 113 days before submission.
          type: boolean
        received_date:
          description: When did the cardholder receive the merchandise or services? Required.
          format: date
          type: string
        resolution_prohibited_by_local_law:
          description: 'Is an attempt to resolve the dispute with the merchant prohibited by local law or regulations? Required when `cardholder_attempted_resolution` is false. Must be true: Visa does not accept a dispute where the cardholder neither attempted resolution nor was prohibited from doing so.'
          type: boolean
        return_attempt_details:
          description: How did the cardholder attempt to return the merchandise? Required when a return was attempted.
          example: The cardholder requested a return label, but the merchant did not respond.
          maxLength: 10000
          type: string
        return_method:
          allOf:
          - $ref: '#/components/schemas/CardDisputeReturnMethod'
          description: How was the merchandise returned? Required when the merchandise was returned.
        return_method_details:
          description: How was the merchandise returned, when `return_method` is `other`? Required in that case.
          example: The cardholder dropped the merchandise off at the merchant's retail store.
          maxLength: 10000
          type: string
        return_tracking_number:
          description: What is the shipment's tracking number? Optional. Sent to the network only when `return_method` is `fedex`, `dhl`, `ups`, `postal_service` or `other`.
          example: 1Z999AA10123456784
          maxLength: 50
          type: string
        returned_date:
          description: When did the cardholder return the merchandise? Required when the merchandise was returned.
          format: date
          type: string
      type: object
    SimulateCardholderBillingAddress:
      description: 'The billing address the cardholder enters, for example at checkout or at a fuel pump. The simulator sends it in

        the Visa address verification (AVS) fields, and Column''s real AVS check compares each field with the

        cardholder entity''s address. The results appear in the card transaction''s `cardholder_verification_details`

        as `street_address_verification_status` and `postal_code_verification_status`: `verified` when the field

        matches, `invalid` when it doesn''t, and `not_provided` when it is omitted. AVS is informational: a mismatch

        does not decline the authorization, and the merchant decides what to do with the result.

        '
      properties:
        postal_code:
          description: 'The postal code, as 1 to 9 letters, digits, spaces or hyphens. Send a US ZIP+4 as 9 digits without the

            hyphen, for example `941051234`. A 5-digit ZIP matches a ZIP+4 on file with the same first 5 digits.

            '
          example: '94105'
          maxLength: 9
          minLength: 1
          pattern: ^[A-Za-z0-9 -]{1,9}$
          type: string
        street:
          description: 'The street address line, as 1 to 40 printable ASCII characters. AVS compares the digits in the address

            (the house number, plus any unit number), so `123 Main St` matches an address on file of `123 Main Street`.

            '
          example: 123 Main St
          maxLength: 40
          minLength: 1
          pattern: ^[\x20-\x7E]{1,40}$
          type: string
      type: object
    ListCardTransactionsResponse:
