          example: iPhone
          type:
          - string
          - 'null'
        device_type:
          description: 'The type of device the token is provisioned to. Possible values: `mobile_phone`, `tablet`, `watch`, `mobile_phone_or_tablet`, `pc`, `ecommerce`, `unknown`'
          enum:
          - mobile_phone
          - tablet
          - watch
          - mobile_phone_or_tablet
          - pc
          - ecommerce
          - unknown
          example: mobile_phone
          type:
          - string
          - 'null'
        first_activated_at:
          description: Timestamp when the token was first activated
          format: date-time
          type:
          - string
          - 'null'
        first_paused_at:
          description: Timestamp when the token was first paused
          format: date-time
          type:
          - string
          - 'null'
        id:
          description: The ID of the card token
          example: ctkn_2x8gszy5folpA9s0TOCseE9ABDM
