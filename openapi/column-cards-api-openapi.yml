    SimulateCreateCardProgramRequest:
      description: Request body for creating a sandbox card program
      properties:
        credit_policy:
          description: 'The credit policy for credit and charge card programs. Defaults to `unsecured` if not

            specified. Ignored for debit programs.

            '
          enum:
          - unsecured
          - cardholder_secured
          - platform_secured
          type:
          - string
          - 'null'
