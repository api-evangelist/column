        last_activated_at:
          description: Timestamp when the token was last activated
          format: date-time
          type:
          - string
          - 'null'
        last_paused_at:
          description: Timestamp when the token was last paused
          format: date-time
          type:
          - string
          - 'null'
        network_token_reference_id:
          description: The network token reference used to identify this token in wallet SDKs. Available for Visa tokens when assigned by the network.
          example: DNITHE302312345678901234
          type: string
        pending_activation_at:
          description: Timestamp when the token entered `pending_activation` status
          format: date-time
          type:
          - string
          - 'null'
        pending_authentication_at:
          description: Timestamp when the token entered `pending_authentication` status
          format: date-time
          type:
          - string
          - 'null'
        provisioning_decisioning_details:
          allOf:
          - $ref: '#/components/schemas/CardTokenProvisioningDecisioningDetails'
          description: Provisioning decisioning details for the card token
          type:
          - object
          - 'null'
        requestor_name:
          description: The name of the token requestor (e.g., the digital wallet provider)
          example: Apple Pay
