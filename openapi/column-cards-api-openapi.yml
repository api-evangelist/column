openapi: 3.2.0
info:
  title: Column Cards API
  version: '1.4'
  contact:
    name: Column
    url: https://column.com
    email: support@column.com
servers:
- url: https://api.column.com/
security:
- BasicAuth: []
tags:
- name: Cards
paths:
  /issuing/card-accounts:
    get:
      description: Retrieve a list of card accounts.
      operationId: Cards_ListCardAccounts
      parameters:
      - description: Filter card accounts by card program ID.
        in: query
        name: card_program_id
        required: false
        schema:
          type: string
      - description: A cursor for use in pagination. `ending_before` is an ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `foo_ZXhhbXBsZQo`, your subsequent call can include `ending_before=foo_ZXhhbXBsZQo` in order to fetch the previous page of the list.
        in: query
        name: ending_before
        required: false
        schema:
          type: string
      - description: A limit on the number of objects to be returned, between `1` and `100`. The default is `10`.
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: A cursor for use in pagination. `starting_after` is an ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `foo_ZXhhbXBsZQo`, your subsequent call can include `starting_after=foo_ZXhhbXBsZQo` in order to fetch the next page of the list.
        in: query
        name: starting_after
        required: false
        schema:
          type: string
      - description: Filter card accounts by status.
        in: query
        name: statuses
        required: false
        schema:
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCardAccountsResponse'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: List card accounts
      tags:
      - Cards
    post:
      description: Create a new card account.
      operationId: Cards_CreateCardAccount
      parameters:
      - description: Idempotency keys can be up to 255 characters long and are case sensitive. Column reserves the right to expire idempotency keys after 30 days. Only ASCII printable characters (code 32 - 126) are allowed for idempotency keys.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardAccountRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAccount'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Create card account
      tags:
      - Cards
  /issuing/card-accounts/{card_account_id}:
    get:
      description: Retrieve detailed information about a specific card account.
      operationId: Cards_GetCardAccount
      parameters:
      - in: path
        name: card_account_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAccount'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Get card account by ID
      tags:
      - Cards
  /issuing/card-accounts/{card_account_id}/close:
    patch:
      description: Permanently close an `open` card account. Fires an `issuing.card_account.closed` event. With `deactivate_cards_and_card_tokens`, its cards and card tokens are deactivated and fire their own events.
      operationId: Cards_CloseCardAccount
      parameters:
      - in: path
        name: card_account_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseCardAccountRequest'
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAccount'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Close card account
      tags:
      - Cards
  /issuing/card-accounts/{card_account_id}/reinstate:
    patch:
      description: Reinstate a previously suspended card account. Fires an `issuing.card_account.reinstated` event. Cards paused by the suspension stay paused until you activate them.
      operationId: Cards_ReinstateCardAccount
      parameters:
      - in: path
        name: card_account_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAccount'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Reinstate card account
      tags:
      - Cards
  /issuing/card-accounts/{card_account_id}/suspend:
    patch:
      description: Suspend an `open` card account and pause its active cards. Fires an `issuing.card_account.suspended` event, and an `issuing.card.paused` event for each card it pauses.
      operationId: Cards_SuspendCardAccount
      parameters:
      - in: path
        name: card_account_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAccount'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Suspend card account
      tags:
      - Cards
  /issuing/card-authorization-policies:
    post:
      description: Create a new card authorization policy and its initial version.
      operationId: Cards_CreateCardAuthorizationPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardAuthorizationPolicyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAuthorizationPolicyVersion'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Create card authorization policy
      tags:
      - Cards
  /issuing/card-authorization-policy-versions:
    get:
      description: Retrieve a list of versions for the specified card authorization policy.
      operationId: Cards_ListCardAuthorizationPolicyVersions
      parameters:
      - description: The card authorization policy ID to list versions for.
        in: query
        name: card_authorization_policy_id
        required: true
        schema:
          type: string
      - description: Return results where the effective date is greater than this value.
        in: query
        name: effective_on.gt
        required: false
        schema:
          format: date-time
          type: string
      - description: Return results where the effective date is greater than or equal to this value.
        in: query
        name: effective_on.gte
        required: false
        schema:
          format: date-time
          type: string
      - description: Return results where the effective date is less than this value.
        in: query
        name: effective_on.lt
        required: false
        schema:
          format: date-time
          type: string
      - description: Return results where the effective date is less than or equal to this value.
        in: query
        name: effective_on.lte
        required: false
        schema:
          format: date-time
          type: string
      - description: A cursor for use in pagination. `ending_before` is an ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `foo_ZXhhbXBsZQo`, your subsequent call can include `ending_before=foo_ZXhhbXBsZQo` in order to fetch the previous page of the list.
        in: query
        name: ending_before
        required: false
        schema:
          type: string
      - description: A limit on the number of objects to be returned, between `1` and `100`. The default is `10`.
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: A cursor for use in pagination. `starting_after` is an ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `foo_ZXhhbXBsZQo`, your subsequent call can include `starting_after=foo_ZXhhbXBsZQo` in order to fetch the next page of the list.
        in: query
        name: starting_after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCardAuthorizationPolicyVersionsResponse'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: List card authorization policy versions
      tags:
      - Cards
    post:
      description: Create a new version for an existing card authorization policy.
      operationId: Cards_CreateCardAuthorizationPolicyVersion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardAuthorizationPolicyVersionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAuthorizationPolicyVersion'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Create card authorization policy version
      tags:
      - Cards
  /issuing/card-authorization-policy-versions/{card_authorization_policy_version_id}:
    delete:
      description: Delete a specific card authorization policy version.
      operationId: Cards_DeleteCardAuthorizationPolicyVersion
      parameters:
      - in: path
        name: card_authorization_policy_version_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Delete card authorization policy version
      tags:
      - Cards
    get:
      description: Retrieve a specific card authorization policy version by its ID.
      operationId: Cards_GetCardAuthorizationPolicyVersion
      parameters:
      - in: path
        name: card_authorization_policy_version_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAuthorizationPolicyVersion'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Get card authorization policy version
      tags:
      - Cards
    patch:
      description: Update a specific card authorization policy version.
      operationId: Cards_UpdateCardAuthorizationPolicyVersion
      parameters:
      - in: path
        name: card_authorization_policy_version_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardAuthorizationPolicyVersionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAuthorizationPolicyVersion'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Update card authorization policy version
      tags:
      - Cards
  /issuing/card-dispute-eligibility:
    post:
      description: Check whether a card transaction can be disputed without creating a dispute.
      operationId: Cards_CheckCardDisputeEligibility
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardDisputeEligibilityRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDisputeEligibilityResponse'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Check card dispute eligibility
      tags:
      - Cards
  /issuing/card-disputes:
    get:
      description: Retrieve a list of card disputes.
      operationId: Cards_ListCardDisputes
      parameters:
      - description: Filter card disputes by card transaction ID.
        in: query
        name: card_transaction_id
        required: false
        schema:
          type: string
      - description: A cursor for use in pagination. `ending_before` is a card dispute ID that defines your place in the list.
        in: query
        name: ending_before
        required: false
        schema:
          type: string
      - description: A limit on the number of objects to be returned, between `1` and `100`. The default is `10`.
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: Filter card disputes by dispute stage.
        in: query
        name: stage
        required: false
        schema:
          enum:
          - initiated
          - disputed
          - merchant_responded
          - merchant_response_recalled
          - prearbitration
          - prearbitration_responded
          - arbitration
          - dispute_won
          - dispute_close
          type: string
      - description: A cursor for use in pagination. `starting_after` is a card dispute ID that defines your place in the list.
        in: query
        name: starting_after
        required: false
        schema:
          type: string
      - description: Filter card disputes by network submission status.
        in: query
        name: submission_status
        required: false
        schema:
          enum:
          - not_required
          - draft
          - pending_submission
          - submitted
          - requires_action
          - failed
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCardDisputesResponse'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: List card disputes
      tags:
      - Cards
    post:
      description: Create a local card dispute for a settled card transaction.
      operationId: Cards_CreateCardDispute
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardDisputeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDispute'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Create card dispute
      tags:
      - Cards
  /issuing/card-disputes/{card_dispute_id}:
    get:
      description: Retrieve detailed information about a specific card dispute.
      operationId: Cards_GetDispute
      parameters:
      - in: path
        name: card_dispute_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDispute'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Get card dispute by ID
      tags:
      - Cards
  /issuing/card-disputes/{card_dispute_id}/close:
    post:
      description: Close a card dispute in the cardholder's favor (platform assumes liability) or as withdrawn by the cardholder. Submitted Visa disputes are recalled from the network first.
      operationId: Cards_CloseCardDispute
      parameters:
      - in: path
        name: card_dispute_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseCardDisputeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDispute'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Close card dispute
      tags:
      - Cards
  /issuing/card-disputes/{card_dispute_id}/evidence:
    post:
      description: Add document or narrative evidence to a card dispute.
      operationId: Cards_AddCardDisputeEvidence
      parameters:
      - in: path
        name: card_dispute_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCardDisputeEvidenceRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDispute'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Add card dispute evidence
      tags:
      - Cards
  /issuing/card-disputes/{card_dispute_id}/provisional-credit:
    delete:
      description: Reverse a draft card dispute's provisional credit back into the card program's operating account and set `provisional_credit` to `false`. The reversal is recorded on the card transaction as a `dispute_credit_reversal` event. For a debit card program, the cardholder's bank account must still hold the credited funds. Repeating the request once the credit is removed changes nothing.
      operationId: Cards_RemoveCardDisputeProvisionalCredit
      parameters:
      - in: path
        name: card_dispute_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDispute'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Remove card dispute provisional credit
      tags:
      - Cards
    post:
      description: Credit the cardholder the dispute amount from the card program's operating account while the dispute is a draft. The credit is recorded on the card transaction as a `dispute_credit` event. Repeating the request while the credit is in place changes nothing. Not supported for `original_credit_not_accepted` disputes.
      operationId: Cards_IssueCardDisputeProvisionalCredit
      parameters:
      - in: path
        name: card_dispute_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDispute'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Issue card dispute provisional credit
      tags:
      - Cards
  /issuing/card-disputes/{card_dispute_id}/respond:
    post:
      description: Queue a response to the card network for the current dispute stage.
      operationId: Cards_RespondCardDispute
      parameters:
      - in: path
        name: card_dispute_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondCardDisputeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDispute'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Respond to card dispute
      tags:
      - Cards
  /issuing/card-disputes/{card_dispute_id}/submit:
    post:
      description: Queue a local card dispute for network submission.
      operationId: Cards_SubmitCardDispute
      parameters:
      - in: path
        name: card_dispute_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDispute'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Submit card dispute
      tags:
      - Cards
  /issuing/card-disputes/documents:
    post:
      description: 'Upload a card dispute evidence document with a `Content-Type: multipart/form-data` request containing a `file` and optional `description` and `tag` fields. The `type` field is ignored: documents uploaded here are always `card_dispute_evidence` and are the only ones accepted as `document_id` when adding evidence to a card dispute. The response `url` expires after 60 seconds.'
      operationId: Cards_UploadCardDisputeDocument
      parameters:
      - description: Idempotency keys can be up to 255 characters long and are case sensitive. Column reserves the right to expire idempotency keys after 30 days. Only ASCII printable characters (code 32 - 126) are allowed for idempotency keys.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                description:
                  type: string
                file:
                  description: The file to upload, sent per RFC 2388 `multipart/form-data` protocol.
                  format: binary
                  type: string
                tag:
                  type: string
              required:
              - file
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Upload card dispute document
      tags:
      - Cards
  /issuing/card-disputes/documents/{document_id}:
    get:
      description: Retrieve a card dispute evidence document by ID (platform-uploaded or Visa-returned evidence). The response `url` expires after 60 seconds.
      operationId: Cards_GetCardDisputeDocument
      parameters:
      - in: path
        name: document_id
        required: true
        schema:
          type: string
      - description: Set to `attachment` to have the presigned download URL return the file as a download instead of inline.
        in: query
        name: content_disposition
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Get card dispute document
      tags:
      - Cards
  /issuing/card-programs:
    get:
      description: Retrieve a list of card programs.
      operationId: Cards_ListCardPrograms
      parameters:
      - description: A cursor for use in pagination. `ending_before` is an ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, starting with `foo_ZXhhbXBsZQo`, your subsequent call can include `ending_before=foo_ZXhhbXBsZQo` in order to fetch the previous page of the list.
        in: query
        name: ending_before
        required: false
        schema:
          type: string
      - description: A limit on the number of objects to be returned, between `1` and `100`. The default is `10`.
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: A cursor for use in pagination. `starting_after` is an ID that defines your place in the list. For instance, if you make a list request and receive 20 objects, ending with `foo_ZXhhbXBsZQo`, your subsequent call can include `starting_after=foo_ZXhhbXBsZQo` in order to fetch the next page of the list.
        in: query
        name: starting_after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
