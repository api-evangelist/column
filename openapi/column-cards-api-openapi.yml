    CardDisputeIncorrectAmountReasonDetails:
      description: Details for an incorrect-amount dispute. An uploaded document (the cardholder's receipt) is required before submission. The dispute amount must be less than the transaction amount, and no more than the transaction amount less `cardholder_receipt_amount`.
      properties:
        cardholder_receipt_amount:
          description: 'The amount shown on the cardholder''s receipt, in the smallest unit of the dispute currency.

            This is the correct amount, as opposed to the amount actually charged. Required, and must leave the

            dispute amount no more than the transaction amount less this amount.

            '
          format: int64
          type: integer
        quoted_price_difference:
          description: Is the dispute due to the difference between the price the merchant quoted and what it actually charged? Required when the transaction is with a travel and entertainment merchant (airline, car rental, lodging or passenger railway) and `cardholder_receipt_amount` differs from the transaction amount; otherwise stored but not sent to the network.
          type: boolean
      type: object
