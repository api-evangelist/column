    SimulateThreeDSChallengeRequest:
      description: Request body for simulating a 3DS challenge (OTP generation)
      properties:
        amount:
          description: 'Transaction amount in the smallest unit of the currency (e.g., cents for USD).

            '
          example: 1000
          format: int64
          type: integer
        currency:
          description: 'ISO 4217 currency code for the transaction.

            '
