        event_type:
          description: 'The type of the card transaction event. Possible values: `financial`, `financial_reversal`, `authorization`, `authorization_reversal`, `authorization_expiration`, `authorization_completion`, `incremental_authorization`, `incremental_authorization_reversal`, `reauthorization`, `reauthorization_reversal`, `refund_authorization`, `refund_authorization_reversal`, `refund_financial`, `refund_financial_reversal`, `clear`, `clear_reversal`, `credit_clear`, `credit_clear_reversal`, `credit_applied`, `force_clear`, `force_clear_reversal`, `account_verification`, `original_credit`, `original_credit_reversal`, `balance_inquiry`, `dispute_credit`, `dispute_credit_reversal`, `dispute_debit`, `dispute_debit_reversal`, `credit_applied_reversal`'
          enum:
          - financial
          - financial_reversal
          - authorization
          - authorization_reversal
          - authorization_expiration
          - authorization_completion
          - incremental_authorization
          - incremental_authorization_reversal
          - reauthorization
          - reauthorization_reversal
          - refund_authorization
          - refund_authorization_reversal
          - refund_financial
          - refund_financial_reversal
          - clear
          - clear_reversal
          - credit_clear
          - credit_clear_reversal
          - credit_applied
          - force_clear
          - force_clear_reversal
          - account_verification
          - original_credit
          - original_credit_reversal
          - balance_inquiry
          - dispute_credit
          - dispute_credit_reversal
          - dispute_debit
          - dispute_debit_reversal
          - credit_applied_reversal
          type: string
        id:
          description: The ID of the card transaction event
          example: ctxe_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^ctxe_[0-9A-Za-z]{27}$
