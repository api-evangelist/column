    SimulateCaptureRequest:
      description: Request body for simulating a capture
      properties:
        cardholder_amount:
          description: 'Amount to capture, expressed in the smallest currency unit (e.g., cents for `USD`).

            For partial captures (`is_partial_capture: true`), must be less than or equal to the

            remaining authorized amount. For full/final captures, over-capture is permitted

            (e.g., for tips, hotel incidentals, or fuel charges).

            Must not exceed 999999999999.

            '
          example: 1000
          format: int64
          maximum: 999999999999
          type: integer
        is_partial_capture:
          description: 'If `true`, keeps the remaining authorization hold active for future captures

            (partial capture / split shipment). If `false` or not provided (default),

            releases the entire remaining authorization hold (final capture).

            '
          example: true
          type: boolean
      required:
      - cardholder_amount
      type: object
