      type: object
    CardTemplate:
      description: The card template object represents a physical card design in a card program. Pass its `id` as `card_template_id` when creating a physical card.
      properties:
        card_program_id:
          description: The ID of the card program the card template belongs to. A card can only use a template from its card account's card program.
          example: cpgm_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^cpgm_[0-9A-Za-z]{27}$
          type: string
        created_at:
          description: The creation date of the card template
          format: date-time
          type: string
        description:
          description: The description of the card template
          example: Black card with a silver logo
          type:
          - string
          - 'null'
        id:
          description: The ID of the card template
          example: ctmp_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^ctmp_[0-9A-Za-z]{27}$
          type: string
        name:
          description: The name of the card template
          example: Black card
          type: string
      required:
      - id
      - card_program_id
      - name
      - description
      - created_at
      type: object
    CardDisputeDuplicateProcessingReasonDetails:
      description: Details for a duplicate-processing dispute. `cash_receipt`, `cancelled_check`, `other_card_statement` and `other` proofs, and a `third_party_voucher` with `merchant_passed_on_funds_evidence`, require an uploaded document before submission.
      properties:
        merchant_passed_on_funds_evidence:
          description: Does the issuer have evidence that the first merchant passed on the funds to the second merchant? Required when `other_payment_proof` is `third_party_voucher`. Visa blocks the dispute unless it does, so `false` is rejected.
          type: boolean
        other_acquirer_reference_number:
          description: What is the other transaction's acquirer reference number? Required when `other_payment_proof` is `acquirer_reference_number`. 23 or 24 digits.
          pattern: ^([0-9]{23}|[0-9]{24})$
          type: string
        other_card_transaction_id:
          description: Which card transaction is the other charge? Required when `other_transaction_on_same_card` or `other_transaction_on_different_card` is true. It must belong to this platform, be on the same card number as the disputed transaction when `other_transaction_on_same_card` is true and on a different card number otherwise, and carry a Visa transaction identifier.
          example: ctxn_3y9htaz6gomqB0t1UPDtfF0BCEN
          pattern: ^ctxn_[0-9A-Za-z]{27}$
          type: string
        other_network_transaction_id:
          description: What is the other transaction's Visa transaction identifier? Required when `other_payment_proof` is `network_transaction_id`. 15 digits, or 17 with a multiple clearing sequence number.
          example: '305123456789012'
          pattern: ^([0-9]{15}|[0-9]{17})$
          type: string
        other_payment_proof:
          allOf:
          - $ref: '#/components/schemas/CardDisputeOtherPaymentProof'
          description: What proof of the payment by other means is available? Required when `other_transaction_paid_by_other_means` is true.
        other_transaction_on_different_card:
          description: Is the other transaction for the same merchant and on a different Visa card of the same cardholder? Required when `other_transaction_on_same_card` is false.
          type: boolean
        other_transaction_on_same_card:
          description: Are both transactions for the same merchant and on the same card? Required. A renewed or damaged-card replacement that keeps the card number is the same card.
          type: boolean
        other_transaction_paid_by_other_means:
          description: Was the other transaction paid by other means? Required when the other transaction is on neither card. Visa blocks the dispute unless it was, so `false` is rejected.
          type: boolean
      type: object
    CardDisputeReturnMethod:
      description: How the cardholder returned merchandise to the merchant.
      enum:
      - face_to_face
      - fedex
      - dhl
      - ups
      - postal_service
      - other
      type: string
    SimulateCheckEligibilityRequest:
      description: Request body for simulating a check-eligibility request
      properties:
        card_id:
          description: The ID of the card to check eligibility for
          example: card_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^card_[0-9A-Za-z]{27}$
          type: string
      required:
      - card_id
      type: object
    Card:
      description: The card object represents a payment card attached to a card account.
      properties:
        authorized_user_entity_id:
          description: The ID of the person entity authorized to use this card
          type: string
        bin:
          description: The 6 or 8-digit BIN (Bank Identification Number) for the card
          example: '41234567'
          pattern: ^[0-9]{8}$
          type: string
        card_account_id:
          description: The ID of the card account
          example: cacc_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^cacc_[0-9A-Za-z]{27}$
          type: string
        card_authorization_policy_id:
          description: The ID of the card authorization policy
          example: caup_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^caup_[0-9A-Za-z]{27}$
          type: string
        card_program_id:
          description: The ID of the card program
          example: cpgm_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^cpgm_[0-9A-Za-z]{27}$
          type: string
        card_template_id:
          description: 'The ID of the card template the physical card was created with: the `card_template_id` from the create request, or the card program''s default card template when none was given. Renewed and replaced cards keep the original card''s template. This field is `null` for virtual cards.'
          example: ctmp_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^ctmp_[0-9A-Za-z]{27}$
          type:
          - string
          - 'null'
        created_at:
          description: The creation date of the card
          format: date-time
          type: string
        deactivated_at:
          description: The timestamp when the card was deactivated
          example: null
          format: date-time
          type:
          - string
          - 'null'
        deactivation_reason:
          description: 'The reason this card was deactivated. Null until deactivation. When a card is replaced, this reason is recorded on the original card, not the new replacement card. Historical cards may return an inferred reason; generic legacy deactivations are reported as `voluntary`.

            '
          enum:
          - lost
          - stolen
          - fraud
          - expired
          - voluntary
          - renewed
          - account_closed
          - damaged
          - null
          example: null
          type:
          - string
          - 'null'
        description:
          description: A description for this card. Empty when unset. Renewed and replaced cards keep the original card's description.
          example: Marketing team travel card
          type: string
        expiration_month:
          description: The expiration month of the card (1-12)
          example: 12
          type: integer
        expiration_year:
          description: The expiration year of the card (4-digit year, e.g. 2025)
          example: 2029
          type: integer
        first_activated_at:
          description: The timestamp when the card was first activated
          format: date-time
          type:
          - string
          - 'null'
        id:
          description: The ID of the card
          example: card_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^card_[0-9A-Za-z]{27}$
          type: string
        last_active_at:
          description: Timestamp when the card was last set to active status
          format: date-time
          type:
          - string
          - 'null'
        last_four_digits:
          description: The last four digits of the card PAN
          example: '1234'
          pattern: ^[0-9]{4}$
          type: string
        last_inactive_at:
          description: Timestamp when the card was last set to deactivated status
          example: null
          format: date-time
          type:
          - string
          - 'null'
        last_paused_at:
          description: Timestamp when the card was last set to paused status
          example: null
          format: date-time
          type:
          - string
          - 'null'
        manufacturing_details:
          allOf:
          - $ref: '#/components/schemas/ManufacturingDetails'
          description: Manufacturing and shipping details for physical cards. This field is `null` for virtual cards
          type:
          - object
          - 'null'
        original_card_id:
          description: The ID of the card that this card replaced. Populated on the replacement card
          example: null
          pattern: ^card_[0-9A-Za-z]{27}$
          type:
          - string
          - 'null'
        pin_status:
          description: 'The state of the card''s PIN. `set`: the card has a PIN. A debit card created with an `encrypted_pin` or `generate_pin`, or renewed from a card that had a PIN, has one, and setting a PIN later also moves it to `set`. `unset`: the card has no PIN, and transactions that require a PIN decline with `pin_not_set`. Always `unset` for non-debit cards. `blocked`: the card has a PIN, but it is locked after too many wrong attempts. A PIN carried over on renewal or replacement starts unblocked, even if the original card''s PIN was blocked.'
          enum:
          - set
          - unset
          - blocked
          example: set
          type: string
        platform_id:
          description: The ID of the platform that owns this card
          type: string
        replacement_card_id:
          description: The ID of the card that replaced this one. Populated on the original card after replacement
          example: null
          pattern: ^card_[0-9A-Za-z]{27}$
          type:
          - string
          - 'null'
        sequence_number:
          description: The sequence number of the card. Starts at 1 for new cards and increments when a card is renewed (same PAN, new expiration). Resets to 1 when a card is replaced (new PAN)
          example: 1
          format: uint64
          minimum: 1
          type: integer
        status:
          description: 'The current status of the card. Possible values: `active`, `paused`, `deactivated`'
          enum:
          - active
          - paused
          - deactivated
          type: string
        type:
          description: 'The form factor of the card. Possible values: `virtual`, `physical`.'
          example: physical
          type: string
      required:
      - id
      - card_account_id
      - card_program_id
      - authorized_user_entity_id
      - description
      - platform_id
      - status
      - type
      - last_four_digits
      - sequence_number
      - created_at
      - expiration_month
      - expiration_year
      - pin_status
      type: object
    CreateCardAuthorizationPolicyRequest:
      properties:
        config:
          allOf:
          - $ref: '#/components/schemas/CardAuthorizationPolicy'
          description: Policy configuration
        effective_on:
          description: When the policy becomes effective, as an RFC 3339 timestamp. Offsets are converted to UTC and fractional seconds are dropped.
          format: date-time
          type: string
        scope:
          description: The scope of this authorization policy (program, account, or card).
          enum:
          - card_program
          - card_account
          - card
          type: string
      required:
      - scope
      - effective_on
      - config
      type: object
    UpdateCardPIN:
      description: Request body for updating a card PIN
      properties:
        current_encrypted_pin:
          description: 'The card''s current PIN, encrypted the same way as `encrypted_pin`. When present, the PIN is only updated if this matches the card''s current PIN. Requests with a PIN that doesn''t match fail with `current_pin_incorrect`. Column doesn''t limit attempts, so limit them on your side. Omit it to set the PIN without checking the current one. Treat an encrypted PIN like the PIN itself: never log, store, or reuse it, because a stored `encrypted_pin` could be replayed as `current_encrypted_pin` to pass this check.'
          type: string
        encrypted_pin:
          description: 'The base64-encoded encrypted PIN. Treat it like the PIN itself: never log, store, or reuse it.'
          type: string
      required:
      - encrypted_pin
      type: object
    Document:
      description: 'Document objects are a pointer to documents that are created or stored on Column. There are two main types of documents: Documents you upload to Column which support KYC/KYB verification for entities. And report documents generated by Column, which you can download.'
      properties:
        checksum:
          description: The SHA-256 checksum of the uploaded document
          type: string
        created_at:
          description: Timestamp at which the document was created in the Column system
          format: date-time
          type: string
        description:
          description: Description of the document provided when the document was created
          example: Receipt for order 2024-001
          type: string
        id:
          description: The unique id of this object
          example: docu_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^docu_[0-9A-Za-z]{27}$
          type: string
        size:
          description: The file size in bytes
          example: 204800
          format: int64
          type: integer
        tag:
          description: The tag of the document
          type: string
        type:
          description: The type of document
          example: other
          type: string
        updated_at:
          description: The timestamp the document was updated
          format: date-time
          type: string
        url:
          description: URL to download the document. Expires after 60 seconds.
          example: https://example.com/documents/receipt.pdf
          type: string
      required:
      - id
      - created_at
      - updated_at
      - type
      - description
      - tag
      - size
      - checksum
      - url
      type: object
    SimulateDeviceBindingRequest:
      description: Request body for simulating a device binding
      properties:
        decision_override:
          description: 'Forces the device binding outcome, bypassing the card-status-based decision and the

            customer decision webhook. One of `approve`, `decline`, or `step_up`. When omitted, the

            binding flows through the real decisioning path.

            '
          type:
          - string
          - 'null'
        device_id:
          description: Identifier of the device being bound.
          type:
          - string
          - 'null'
        device_name:
          description: A human-readable identifier for the device being bound.
          type:
          - string
          - 'null'
        device_type:
          description: The category of device being bound.
          enum:
          - mobile_phone
          - tablet
          - watch
          example: mobile_phone
          type:
          - string
          - 'null'
        wallet_account_id:
          description: The wallet account identifier associated with the device binding.
          type:
          - string
          - 'null'
      type: object
    SimulateReversalRequest:
      description: Request body for simulating a reversal
      properties:
        cardholder_amount:
          description: 'Amount to reverse, expressed in the smallest unit of the merchant''s currency

            (e.g., cents for `USD`). Must be greater than 0 and less than the outstanding

            authorized amount. Omit to reverse the transaction in full.

            Must not exceed 999999999999.

            '
          example: 400
          format: int64
          maximum: 999999999999
          type: integer
      type: object
    SimulateCardFinancialRequest:
      description: Request body for simulating a full financial transaction
      properties:
        cardholder_amount:
          description: 'Transaction amount in the merchant''s currency, expressed in the smallest currency unit.

            For example, 1000 represents 10.00 `EUR`. When `merchant_currency` is not `USD`,

            this amount is multiplied by `cardholder_fx_rate` to derive the `USD` billing amount.

            Must not exceed 999999999999.

            '
          example: 1000
          format: int64
          maximum: 999999999999
          type: integer
        cardholder_fx_rate:
          description: 'Foreign exchange rate to convert from merchant currency to `USD` (cardholder billing currency),

            as a decimal string. Required when `merchant_currency` is not `USD`.

            For example, if `merchant_currency` is `EUR` and `cardholder_fx_rate` is `"1.10"`,

            a 10.00 `EUR` transaction will result in an 11.00 `USD` cardholder charge.

            '
          example: '1.10'
          type: string
        cardholder_input:
          $ref: '#/components/schemas/SimulateCardholderInput'
        merchant_category_code:
          description: 'Optional merchant category code (ISO 18245 MCC) to put on the simulated message (Field 18), for

            example `5812` (restaurants) or `6011` (ATM). Defaults to `5999`. Use it to exercise real-time

            decisioning rules that depend on the merchant category.

            '
          example: '5812'
          pattern: ^[0-9]{4}$
          type: string
        merchant_city:
          description: 'Optional card acceptor city to put on the simulated message (Field 43, positions 26-38).

            Defaults to `CITY NAME`. At most 13 characters.

            '
          example: OAKLAND
          maxLength: 13
          pattern: ^[ -~]*$
          type: string
        merchant_country_code:
          description: 'Optional card acceptor country, ISO 3166-1 alpha-2, to put on the simulated message (Field 43,

            positions 39-40). Defaults to `US`. Use it to exercise country-based decisioning rules.

            '
          example: CA
          pattern: ^[A-Z]{2}$
          type: string
        merchant_currency:
          description: 'Merchant''s currency code in ISO 4217 format.

            '
          example: EUR
          type: string
        merchant_name:
          description: 'Optional card acceptor name to put on the simulated message (Field 43, positions 1-25).

            Defaults to `ACQUIRER NAME`. At most 25 characters.

            '
          example: BLUE BOTTLE COFFEE
          maxLength: 25
          pattern: ^[ -~]*$
          type: string
        realtime_decision:
          description: "Specifies the issuer's real-time authorization decision to inject if the transaction\nreaches the real-time decisioning step.\n\n- `approve` — the issuer approves the transaction.\n- `decline` — the issuer declines the transaction (see `realtime_decision_reason`).\n- `partially_approve` — the issuer partially approves the transaction\n  (requires `realtime_partially_approved_amount`).\n\nWhen `realtime_decision` is not provided, the simulator attempts a real real-time authorization\ndecision webhook to the platform's configured `decision.issuing.card_transaction` destination\n(declining if no destination is configured).\n"
          enum:
          - approve
          - decline
          - partially_approve
          type: string
        realtime_decision_reason:
          description: 'The reason for the issuer''s real-time decline decision. Only applicable when

            `realtime_decision` is `decline`. Defaults to `generic_decline` if not specified.

            '
          example: insufficient_funds
          type: string
        realtime_funding_account_id:
          description: 'The bank account to just-in-time fund the transaction from, as a platform''s real-time authorization

            decision would name in `funding_account_id`. Only applicable when `realtime_decision` is `approve` or

            `partially_approve`, and only on debit card programs with `jit_funding_enabled`.

            '
          example: bacc_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^bacc_[0-9A-Za-z]{27}$
          type: string
        realtime_partially_approved_amount:
          description: 'The amount to partially approve, in the smallest unit of the cardholder billing currency (`USD`).

            Required when `realtime_decision` is `partially_approve`, and must be less than the amount

            billed to the cardholder: `cardholder_amount` when `merchant_currency` is `USD`, or

            `cardholder_amount` converted at `cardholder_fx_rate` otherwise.

            '
          example: 50
          format: int64
          maximum: 999999999999
          type: integer
      required:
      - cardholder_amount
      - merchant_currency
      type: object
    ThreeDSAttemptStatus:
      description: The status of a 3DS authentication attempt
      enum:
      - rejected
      - presented
      - challenged
      - authenticated
      - associated
      example: authenticated
      type: string
    CardDisputeEligibilityReason:
      enum:
