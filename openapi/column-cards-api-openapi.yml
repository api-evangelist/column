          pattern: ^[0-9]{4}$
          type:
          - string
          - 'null'
        merchant_country_code:
          description: 'Optional merchant country, ISO 3166-1 alpha-2, to put on the simulated 3DS attempt and on the

            decision request.

            '
          example: CA
          pattern: ^[A-Z]{2}$
          type:
          - string
          - 'null'
        merchant_name:
