      - amount
      type: object
    CardDisputeMisrepresentationReasonDetails:
      properties:
        attempted_return_date:
          description: When did the cardholder attempt to return the merchandise? Required when a return was attempted.
          format: date
          type: string
        cancellation_date:
          description: When did the cardholder cancel the services? Required when the services were canceled.
          format: date
          type: string
        cancellation_method:
          description: How and why did the cardholder cancel the services? Required when the services were canceled.
          example: The cardholder canceled by email to the merchant's support address.
          maxLength: 10000
          type: string
        cardholder_attempted_resolution:
          description: Did the cardholder attempt to resolve the dispute with the merchant? Required for merchandise, and for services the cardholder canceled.
          type: boolean
        cardholder_attempted_return:
          description: Did the cardholder attempt to return the merchandise? Required when the merchandise was not returned.
          type: boolean
        cardholder_canceled:
          description: Did the cardholder cancel the services? Required for services.
          type: boolean
        cardholder_first_notified_issuer_date:
          description: When did the cardholder first notify the issuer of the dispute? Required when `previous_negotiation_evidence` is true.
          format: date
          type: string
        cardholder_returned_merchandise:
          description: Did the cardholder return the merchandise? Required for merchandise.
          type: boolean
        merchandise_or_services:
          allOf:
          - $ref: '#/components/schemas/CardDisputeMerchandiseOrServices'
          description: Was the disputed purchase merchandise or services? Required.
        merchant_received_return_date:
          description: When did the merchant receive the returned merchandise? Required when the merchandise was returned.
          format: date
          type: string
        merchant_return_refusal_reason:
          allOf:
          - $ref: '#/components/schemas/CardDisputeReturnRefusalReason'
          description: Why did the merchant not provide or accept a merchandise return? Required when a return was attempted. Must be `refused_return_authorization`, `refused_accept_returned_merchandise` or `advised_not_to_return`.
        misrepresentation_details:
          description: How was the merchandise or service misrepresented? Required.
          example: The merchant advertised the jacket as waterproof, but it is not.
          maxLength: 10000
          type: string
        negotiation_details:
          description: What were the previous ongoing negotiations between the cardholder and the merchant? Required when `previous_negotiation_evidence` is true.
          example: The cardholder emailed the merchant twice asking for a refund and received no response.
          maxLength: 10000
          type: string
        negotiation_start_date:
          description: When did the negotiations begin? Required when `previous_negotiation_evidence` is true.
          format: date
          type: string
        order_details:
          description: What did the cardholder purchase? Required.
          example: A pair of running shoes ordered from the merchant's website.
          maxLength: 10000
          type: string
        previous_negotiation_evidence:
          description: Is there evidence of previous ongoing negotiations between the cardholder and the merchant? Required when both `received_date` and the transaction's processing date are more than 113 days before submission.
          type: boolean
        received_date:
          description: When did the cardholder receive the merchandise or services? Required.
          format: date
          type: string
        resolution_prohibited_by_local_law:
          description: 'Is an attempt to resolve the dispute with the merchant prohibited by local law or regulations? Required when `cardholder_attempted_resolution` is false. Must be true: Visa does not accept a dispute where the cardholder neither attempted resolution nor was prohibited from doing so.'
          type: boolean
        return_attempt_details:
          description: How did the cardholder attempt to return the merchandise? Optional.
          example: The cardholder requested a return label, but the merchant did not respond.
          maxLength: 10000
          type: string
        return_method:
          allOf:
          - $ref: '#/components/schemas/CardDisputeReturnMethod'
          description: How was the merchandise returned? Required when the merchandise was returned.
        return_method_details:
          description: How was the merchandise returned, when `return_method` is `other`? Required in that case.
          example: The cardholder dropped the merchandise off at the merchant's retail store.
          maxLength: 10000
          type: string
        return_tracking_number:
          description: What is the shipment's tracking number? Optional. Sent to the network only when `return_method` is `fedex`, `dhl`, `ups`, `postal_service` or `other`.
          example: 1Z999AA10123456784
          maxLength: 50
          type: string
        returned_date:
          description: When did the cardholder return the merchandise? Required when the merchandise was returned.
          format: date
          type: string
      type: object
    CardAuthorizationPolicyVersion:
