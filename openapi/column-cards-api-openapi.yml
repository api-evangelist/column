    patch:
      description: 'Replace a card and automatically deactivate the original. The response contains the new replacement card;

        retrieve the original card to see its `deactivation_reason` and `replacement_card_id`.


        | Requested reason | PAN | Original card''s recorded reason | Original card''s tokens |

        | --- | --- | --- | --- |

        | `lost`, `stolen`, `fraud`, `voluntary` | New PAN | Requested reason | Deactivated |

        | `damaged` | Reused | `damaged` | Deactivated |

        | `expired` | Reused | `renewed` | Deactivated |


        All non-terminal tokens on the original card are deactivated for every replacement reason, including when the PAN

        is reused. Reusing the PAN increments `sequence_number`. An `expired` replacement records `renewed` as the reason,

        but does not preserve tokens. The separate renew endpoint migrates tokens when the renewal card is activated.

        `renewed` and `account_closed` are not valid replacement request reasons and return HTTP 400. A card can''t be

        replaced as `damaged` or `expired` if any card with the same PAN was deactivated as `lost`, `stolen`, or `fraud`.'
