          description: Per-policy evaluation results showing the outcome of each authorization policy
          items:
            $ref: '#/components/schemas/CardAuthorizationPolicyEvaluationDetail'
          type: array
        decision:
          description: 'The authorization decision. Possible values: `undecided`, `approved`, `partially_approved`, `declined`'
          enum:
          - undecided
          - approved
          - partially_approved
          - declined
          type: string
        decision_reason:
          description: The reason the decision was made. A PIN-entry decline is `pin_not_set` when the card has no PIN set, `pin_invalid` when the entered PIN does not match the card's PIN, `pin_blocked` when the allowed number of PIN tries has been exceeded, `pin_required` when the transaction requires a PIN and none was entered, and `pin_cryptographic_error` when the PIN data could not be read.
          enum:
          - approved
          - partially_approved
          - insufficient_funds
          - suspected_fraud
          - realtime_authorization_request_timeout
          - realtime_authorization_connection_error
          - realtime_authorization_invalid_response
          - manual_override
          - generic_decline
          - error
          - realtime_authorization_endpoint_missing
          - invalid_transaction
          - account_closed
          - account_blocked
          - card_lost
          - card_stolen
          - card_expired
          - invalid_merchant
          - exceeds_approval_amount_limit
          - invalid_verification_code
          - invalid_cvv
          - invalid_cvv2
          - account_verification_succeeded
          - account_verification_and_anticipated_amount_succeeded
          - account_verification_succeeded_unsupported_amount
          - stop_payment
          - invalid_account_type_savings
          - invalid_account_type_checking
          - invalid_account_type_credit
          - three_ds_authentication_required
          - invalid_expiration
          - compliance_decline
          - card_paused
          - pin_cryptographic_error
          - invalid_amount
          - pending
          - realtime_authorization_invalid_funding_account
          - funding_account_insufficient_funds
          - pin_invalid
          - pin_not_set
          - pin_blocked
          - pin_required
          type: string
        decision_source:
          description: 'The party that made the authorization decision. Possible values: `card_network`, `column`, `platform_owner`'
          enum:
          - card_network
          - column
          - platform_owner
          type: string
        funding_account_id:
          description: The bank account the platform's realtime authorization endpoint named to just-in-time fund the authorization. Present whether or not a funding transfer was needed; the transfer itself is in the card transaction's funding_details
          example: bacc_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^bacc_[0-9A-Za-z]{27}$
          type: string
        realtime_authorization_amount:
          description: The amount returned by the platform's realtime authorization endpoint, in the smallest unit of the currency
          format: int64
          type:
          - integer
          - 'null'
        realtime_authorization_decision:
          description: 'The decision returned by the platform''s realtime authorization endpoint. Possible values: approve, partially_approve, decline'
          example: approve
          type:
          - string
          - 'null'
        realtime_authorization_decision_reason:
          description: The decline reason returned by the platform's realtime authorization endpoint
          type:
          - string
          - 'null'
      required:
      - decision_source
      - decision
      - decision_reason
      type: object
