    CardDisputeReason:
      description: 'The reason for a card dispute, which selects the Visa dispute condition Column files: `fraud` (10), `no_authorization` (11), `incorrect_transaction_code` (12.2), `incorrect_currency` (12.3), `incorrect_account_number` (12.4), `incorrect_amount` (12.5), `duplicate_processing` (12.6.1), `paid_by_other_means` (12.6.2), `invalid_data` (12.7), `merchandise_services_not_received` (13.1), `canceled_recurring_transaction` (13.2), `not_as_described` (13.3), `damaged_or_defective_merchandise` (13.3), `quality_of_merchandise_or_services` (13.3), `terms_of_contract` (13.3, Visa Commercial Card Virtual Account transactions), `counterfeit_merchandise` (13.4), `misrepresentation` (13.5), `credit_not_processed` (13.6), `canceled_merchandise_or_services` (13.7), `original_credit_not_accepted` (13.8) and `non_receipt_cash_at_atm` (13.9). `other` has no Visa dispute condition and is not filed with the network.'
      enum:
      - fraud
      - no_authorization
      - incorrect_amount
      - incorrect_account_number
      - merchandise_services_not_received
      - canceled_recurring_transaction
      - not_as_described
      - counterfeit_merchandise
      - misrepresentation
      - credit_not_processed
      - non_receipt_cash_at_atm
      - other
      - duplicate_processing
      - paid_by_other_means
      - incorrect_currency
      - incorrect_transaction_code
      - invalid_data
      - canceled_merchandise_or_services
      - damaged_or_defective_merchandise
      - quality_of_merchandise_or_services
      - original_credit_not_accepted
      - terms_of_contract
      type: string
    SimulateCardholderExpirationDate:
      description: "The expiration date the cardholder presents, which the simulator sends in the message (Field 14). Column\ncompares it with the card's `expiration_month` and `expiration_year`.\n\n- The date matches the card's: expiration verification passes and the transaction continues to decisioning.\n- The date doesn't match: the transaction is declined with `decision_reason` `invalid_expiration` and\n  `decision_source` `column`.\n\nOmit it to send no expiration date, in which case Column skips the check. A card past its own expiration\ndeclines with `card_expired` whatever date is presented.\n"
      properties:
        month:
          description: The expiration month (1-12).
          example: 12
          maximum: 12
          minimum: 1
          type: integer
        year:
          description: 'The expiration year, as a 4-digit year from 2000 to 2068. Field 14 carries only the last two digits, which

            decode to 2000-2068 (00-68) or 1969-1999 (69-99), so later years can''t be presented.

            '
          example: 2029
          maximum: 2068
          minimum: 2000
          type: integer
      required:
      - month
      - year
      type: object
