    CardTransactionFundingDetails:
      description: 'The just-in-time funding of the authorization: the shortfall moved from the platform''s funding account into the card account''s bank account, the funding returned to the funding account as the authorization was reversed, expired, or cleared for less, and returned funding moved back into the card account when such a release was reversed. Each movement appears on both accounts as a ledger entry of the card transaction event that moved it'
      properties:
        currency_code:
          description: The currency of the funded, returned, and restored amounts
          example: USD
          pattern: ^[A-Z]{3}$
          type: string
        funded_amount:
          description: The amount funded, in the smallest unit of the currency
          example: 2500
          format: int64
          type: integer
        funding_account_id:
          description: The bank account the shortfall was funded from and is returned to
          example: bacc_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^bacc_[0-9A-Za-z]{27}$
          type: string
        restored_amount:
          description: Returned funding moved from the funding account into the card account again because the release it was returned for was reversed (for example a clearing reversal restoring the hold), in the smallest unit of the currency
          example: 0
          format: int64
          type: integer
        returned_amount:
          description: The amount returned to the funding account so far, in the smallest unit of the currency
          example: 0
          format: int64
          type: integer
      required:
      - funding_account_id
      - currency_code
      - funded_amount
      - returned_amount
      - restored_amount
      type: object
