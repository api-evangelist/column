          type: string
        service_date:
          description: When was the service provided, or when was it expected to be? Required for `guaranteed_reservation` and `other` services.
          format: date
          type: string
        service_type:
          allOf:
          - $ref: '#/components/schemas/CardDisputeServiceType'
          description: What type of service was canceled? Required for services.
        timeshare_date:
          description: What is the date of the timeshare, or the date the contract or related documents were received? Required for `timeshare` services.
          format: date
          type: string
