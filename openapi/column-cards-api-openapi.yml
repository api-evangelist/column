    RenewCardRequest:
      properties:
        encrypted_pin:
          description: 'Debit card programs only. Omit to keep the original card''s PIN on the renewed card. A carried-over PIN starts unblocked, with no wrong attempts counted, even if the original card''s PIN was blocked. Pass a base64-encoded encrypted PIN to set a new PIN, or `SKIP` to create the renewed card without a PIN (`pin_status` is `unset`) and set one later with `PATCH /issuing/cards/{card_id}/pin`. To have Column choose a new PIN instead, omit this and pass `generate_pin`. Treat an encrypted PIN like the PIN itself: never log, store, or reuse it.

            '
          type: string
        expiration_month:
          description: Optional new expiration month (1-12)
          example: 12
          type: integer
        expiration_year:
          description: Optional new expiration year (4-digit year, e.g. 2025)
          example: 2029
          type: integer
        generate_pin:
          description: 'Debit card programs with PIN reveal enabled only. Pass `true` to have Column set a new random 4-digit PIN on the renewed card instead of keeping the original card''s PIN or providing `encrypted_pin`, which must then be omitted. The PIN is never returned in the response; the cardholder learns it through PIN reveal.

            '
          type: boolean
        status:
          description: Optional status for the renewed card
          example: active
          type: string
      type: object
    ReplaceCardRequest:
      properties:
        deactivation_reason:
          description: 'Reason for deactivating the original card during replacement. `lost`, `stolen`, `fraud`, and `voluntary` requests create a replacement with a new PAN. `damaged` requests reuse the PAN. `expired` requests are processed as renewal-style replacements with the same PAN and a new expiration, and the original card''s reason is recorded as `renewed`. All non-terminal card tokens on the original card are deactivated for every reason. `renewed` and `account_closed` are not accepted by this endpoint.

            '
          enum:
          - lost
          - stolen
          - fraud
          - expired
          - voluntary
          - damaged
          example: lost
          type: string
        encrypted_pin:
          description: 'Debit card programs only. Base64-encoded encrypted PIN for the replacement card. `expired` and `damaged` replacements reuse the PAN, so omitting this keeps the original card''s PIN; pass `SKIP` to create the replacement without a PIN instead. A carried-over PIN starts unblocked, with no wrong attempts counted, even if the original card''s PIN was blocked. `lost`, `stolen`, `fraud`, and `voluntary` replacements get a new PAN, which the original PIN can''t carry over to, so omitting this creates the replacement without a PIN. A card without a PIN has `pin_status` set to `unset`, and transactions that require a PIN decline with `pin_not_set` until you set one with `PATCH /issuing/cards/{card_id}/pin`. To have Column choose a new PIN instead, omit this and pass `generate_pin`. Treat an encrypted PIN like the PIN itself: never log, store, or reuse it.

            '
          type: string
        expiration_month:
          description: Optional expiration month (1-12)
          example: 12
          type: integer
        expiration_year:
          description: Optional expiration year (4-digit year, e.g. 2025)
          example: 2029
          type: integer
        generate_pin:
          description: 'Debit card programs with PIN reveal enabled only. Pass `true` to have Column set a new random 4-digit PIN on the replacement card instead of keeping the original card''s PIN or providing `encrypted_pin`, which must then be omitted. The PIN is never returned in the response; the cardholder learns it through PIN reveal.

            '
          type: boolean
        status:
          description: Optional status for the replacement card
          example: active
          type: string
      required:
      - deactivation_reason
      type: object
    CardDisputeTermsOfContractReasonDetails:
      properties:
        received_date:
          description: When did the cardholder receive the services? Required when the transaction was processed more than 113 days before submission.
          format: date
