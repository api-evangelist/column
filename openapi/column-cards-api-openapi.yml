  /simulate/issuing/card-transactions/{card_transaction_id}/capture:
    post:
      description: 'Simulate a capture that converts an authorization hold into a settled transaction. The original transaction must have

        started as an authorization and have an active hold.


        Set `is_partial_capture` to `true` to keep the remaining hold active for future captures, as with split shipments; the

        amount must not exceed the remaining authorized amount. Otherwise the capture is final and releases the remaining hold,

        and the amount may exceed the authorized amount, as with tips or hotel incidentals.'
      operationId: Cards_SimulateCapture
      parameters:
      - in: path
        name: card_transaction_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateCaptureRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTransaction'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate capture
      tags:
      - Cards
  /simulate/issuing/card-transactions/{card_transaction_id}/incremental-authorization:
    post:
      description: 'Simulate an incremental authorization that adds to an existing authorization hold, such as a hotel stay extension.

        Currency codes are preserved from the initial authorization.


        The original transaction must have started as an authorization, not a full financial transaction, and must not have

        captured funds. Column sends a real-time authorization decision request for the increment to your endpoint subscribed

        to `decision.issuing.card_transaction`, and declines if none is configured.'
      operationId: Cards_SimulateIncrementalAuthorization
      parameters:
      - in: path
        name: card_transaction_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateIncrementalAuthorizationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTransaction'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate incremental authorization
      tags:
      - Cards
  /simulate/issuing/card-transactions/{card_transaction_id}/refund:
    post:
      description: 'Simulate a merchandise return against a settled card transaction. Each call creates a new refund transaction linked to

        the purchase by `original_card_transaction_id`, and the total refunded must not exceed the settled amount.'
      operationId: Cards_SimulateRefund
      parameters:
      - in: path
        name: card_transaction_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateRefundRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTransaction'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate refund
      tags:
      - Cards
  /simulate/issuing/card-transactions/{card_transaction_id}/reversal:
    post:
      description: 'Simulate an acquirer reversing the message that opened a card transaction, as with a voided sale or a

        terminal that never got its authorization response. The transaction must have started as an authorization

        or a full financial transaction.


        Omit `cardholder_amount` to reverse in full: an authorization releases whatever hold the series still

        carries, including incremental authorizations, and a full financial transaction reverses its settled

        amount. Set `cardholder_amount` to release part of an authorization hold and leave the rest active, as

        with a partially filled order; partial reversals don''t apply to full financial transactions.


        Reversals act on the outstanding authorization hold, so a transaction that has already been captured has

        nothing left to reverse — refund it instead.'
      operationId: Cards_SimulateReversal
      parameters:
      - in: path
        name: card_transaction_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateReversalRequest'
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTransaction'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate reversal
      tags:
      - Cards
  /simulate/issuing/cards/{card_id}/card-transactions/authorization:
    post:
      description: 'Simulate a card authorization for a sandbox card. The cardholder is always billed in `USD`; when `merchant_currency`

        is not `USD`, provide `cardholder_fx_rate`.


        When neither `realtime_decision` nor `network_standin` is set, Column sends a real-time authorization decision request

        to your endpoint subscribed to `decision.issuing.card_transaction`, and declines if none is configured. Set

        `realtime_decision` to supply the decision without calling your endpoint, or `network_standin` to simulate the card

        network deciding on your behalf. To attach 3DS authentication details, pass an `authenticated` `three_ds_attempt_id`

        for the same card.


        To test PIN outcomes on a physical card, pass the PIN the cardholder enters in `cardholder_input.pin`. Column checks

        it with its real PIN verification and lockout, so a wrong PIN declines with `pin_invalid`, a card with no PIN with

        `pin_not_set`, and a card whose PIN is blocked after 3 wrong PINs with `pin_blocked`.


        To test card-present and card-not-present decisioning, set `entry_mode` to `swipe`, `keyed` or `ecommerce`. By

        default a physical card is swiped and a virtual card is used at an online checkout. Virtual cards only support

        `ecommerce`, and a PIN can''t be entered with `ecommerce`.


        To test CVV2 outcomes, pass the CVV2 the cardholder enters in `cardholder_input.cvv2` with `entry_mode` `keyed` or

        `ecommerce` (a virtual card''s default). Column checks it with its real CVV2 verification, so a wrong CVV2 declines

        with `invalid_cvv2`. When omitted, the card''s real CVV2 is sent. A swiped card carries no CVV2.


        To test expiration date outcomes, pass the date the cardholder presents in `cardholder_input.expiration_date`.

        Column compares it with the card''s expiration, so a date that doesn''t match declines with `invalid_expiration`.

        Without it, the simulated transaction carries no expiration date and Column skips the check.


        To test address verification (AVS), pass the billing address the cardholder enters in

        `cardholder_input.billing_address`. Column compares it with the cardholder entity''s address and reports each

        field as `verified` or `invalid` in the transaction''s `cardholder_verification_details`. AVS doesn''t decline

        the authorization by itself.'
      operationId: Cards_SimulateCardAuthorization
      parameters:
      - in: path
        name: card_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateCardAuthorizationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTransaction'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate card authorization
      tags:
      - Cards
  /simulate/issuing/cards/{card_id}/card-transactions/financial:
    post:
      description: 'Simulate a full financial transaction for a sandbox card. Full financial transactions capture funds immediately without

        a prior authorization hold, as with transit taps, low-value purchases, and offline transactions. The cardholder is

        always billed in `USD`; when `merchant_currency` is not `USD`, provide `cardholder_fx_rate`.


        When `realtime_decision` is not set, Column sends a real-time authorization decision request to your endpoint

        subscribed to `decision.issuing.card_transaction`, and declines if none is configured. Set `realtime_decision` to

        supply the decision without calling your endpoint.


        To test PIN outcomes on a PIN debit purchase with a physical card, pass the PIN the cardholder enters in

        `cardholder_input.pin`. Column checks it with its real PIN verification and lockout, so a wrong PIN declines with

        `pin_invalid`, a card with no PIN with `pin_not_set`, and a card whose PIN is blocked after 3 wrong PINs with

        `pin_blocked`.


        On a virtual card, `cardholder_input.cvv2` sets the CVV2 the cardholder enters, and a wrong CVV2 declines with

        `invalid_cvv2`.


        `cardholder_input.expiration_date` sets the expiration date the cardholder presents, and a date that doesn''t match

        the card''s declines with `invalid_expiration`.


        To test address verification (AVS), pass the billing address the cardholder enters in

        `cardholder_input.billing_address`, as on an authorization. AVS doesn''t decline the transaction by itself.'
      operationId: Cards_SimulateCardFinancial
      parameters:
      - in: path
        name: card_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateCardFinancialRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTransaction'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate full financial transaction
      tags:
      - Cards
  /simulate/issuing/cards/{card_id}/threeds/challenge:
    post:
      description: 'Simulate a 3DS authentication attempt for a sandbox card and return the resulting 3DS attempt.


        Set `realtime_decision` to supply the authentication decision without calling your endpoint. When it is omitted, Column

        sends a 3DS authentication decision request to your endpoint subscribed to `decision.issuing.card_authentication`; if

        no endpoint is subscribed, the simulator creates an OTP challenge.


        - `frictionless_approve` authenticates the attempt and fires `issuing.3ds.authentication_completed`.

        - `challenge` starts an OTP challenge and fires `issuing.3ds.otp_generated`. Finish it with the complete 3DS challenge

        endpoint.

        - `decline_authentication` rejects the attempt and fires `issuing.3ds.authentication_completed`.'
      operationId: Cards_SimulateThreeDSChallenge
      parameters:
      - in: path
        name: card_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateThreeDSChallengeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDSAttempt'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate 3DS authentication
      tags:
      - Cards
  /simulate/issuing/cards/tokens/{card_token_id}/approve-provisioning:
    post:
      description: 'Simulate a digital wallet''s provisioning request for a card token in `pending_activation` status, as returned by the

        token eligibility check. Set `wallet_type` to `apple_pay`, `google_pay`, or `samsung_pay` to attribute the token to a

        wallet.


        Set `action_code` to `approve`, `decline`, or `step_up` to force the decision without calling your

        `decision.issuing.card_token` endpoint. When it is omitted, the decision flows through Column''s real provisioning

        decisioning, including that endpoint. A `step_up` decision also simulates the step-up methods and send passcode

        callbacks when the cardholder has contact info on file, leaving the token ready for step-up completion.'
      operationId: Cards_SimulateApproveProvisioning
      parameters:
      - in: path
        name: card_token_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateApproveProvisioningRequest'
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardToken'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate approve provisioning
      tags:
      - Cards
  /simulate/issuing/cards/tokens/{card_token_id}/deactivate:
    post:
      description: Simulate the card network deactivating a card token on a `visa_sandbox` card. The token moves to `deactivated` and `issuing.card_token.deactivated` fires, exactly as for a production network notification. Deactivating a token that is already `deactivated` returns it unchanged without firing an event.
      operationId: Cards_SimulateDeactivate
      parameters:
      - in: path
        name: card_token_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateTokenLifecycleRequest'
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardToken'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate token deactivate
      tags:
      - Cards
  /simulate/issuing/cards/tokens/{card_token_id}/device-binding:
    post:
      description: 'Simulate a Visa device binding for a card token on a `visa_sandbox` card. Column records the binding and its decision

        on the token and returns the updated card token.


        Set `decision_override` to `approve`, `decline`, or `step_up` to force the outcome without calling your endpoint. When

        it is omitted, the binding flows through Column''s real decisioning.'
      operationId: Cards_SimulateDeviceBinding
      parameters:
      - in: path
        name: card_token_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateDeviceBindingRequest'
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardToken'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate device binding
      tags:
      - Cards
  /simulate/issuing/cards/tokens/{card_token_id}/resume:
    post:
      description: Simulate the card network resuming a paused card token on a `visa_sandbox` card. The token moves back to `active` and `issuing.card_token.activated` fires, exactly as for a production network notification.
      operationId: Cards_SimulateResume
      parameters:
      - in: path
        name: card_token_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardToken'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate token resume
      tags:
      - Cards
  /simulate/issuing/cards/tokens/{card_token_id}/step-up/complete:
    post:
      description: 'Simulate the final step of Visa''s step-up flow for a sandbox card token in `pending_authentication` status. An

        `outcome` of `success` activates the token and fires `issuing.card_token.activated`; `failure` moves it to

        `activation_denied` and fires `issuing.card_token.activation_denied`. Tokens in any other status return an error.'
      operationId: Cards_SimulateStepUpComplete
      parameters:
      - in: path
        name: card_token_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateStepUpCompleteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardToken'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate step-up complete
      tags:
      - Cards
  /simulate/issuing/cards/tokens/{card_token_id}/step-up/methods:
    post:
      description: 'Simulate Visa''s retrieve step-up methods callback for a sandbox card token. Returns the SMS and email methods available

        from the cardholder''s contact info, or an empty list when none is on file, and records them on the token so a later

        send passcode call can resolve the selected method.'
      operationId: Cards_SimulateStepUpMethods
      parameters:
      - in: path
        name: card_token_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateStepUpMethodsResponse'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate step-up retrieve methods
      tags:
      - Cards
  /simulate/issuing/cards/tokens/{card_token_id}/step-up/send-passcode:
    post:
      description: 'Simulate Visa''s send passcode callback for a sandbox card token, after retrieving step-up methods. Column fires the

        `issuing.card_token.send_passcode` webhook with a simulated one-time passcode and moves the token to

        `pending_authentication`.


        Pass one of the returned method identifiers as `otp_method_identifier` to choose where the passcode goes. When it is

        omitted, an available method is selected automatically.'
      operationId: Cards_SimulateSendPasscode
      parameters:
      - in: path
        name: card_token_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateSendPasscodeRequest'
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateSendPasscodeResponse'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate step-up send passcode
      tags:
      - Cards
  /simulate/issuing/cards/tokens/{card_token_id}/suspend:
    post:
      description: Simulate the card network suspending a card token on a `visa_sandbox` card. The token moves to `paused` and `issuing.card_token.paused` fires, exactly as for a production network notification.
      operationId: Cards_SimulateSuspend
      parameters:
      - in: path
        name: card_token_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardToken'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate token suspend
      tags:
      - Cards
  /simulate/issuing/cards/tokens/check-eligibility:
    post:
      description: 'Simulate a digital wallet checking whether a `visa_sandbox` card can be tokenized, the first step of token

        provisioning. An eligible card returns a new card token in `pending_activation` status; an ineligible card returns an

        error with the reason.


        Continue provisioning by simulating approve provisioning on the returned card token.'
      operationId: Cards_SimulateCheckEligibility
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateCheckEligibilityRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardToken'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Simulate token eligibility check
      tags:
      - Cards
  /simulate/issuing/threeds/{three_ds_attempt_id}/complete:
    post:
      description: 'Complete the OTP challenge on a simulated 3DS attempt. The attempt must have an open challenge, created by simulating a

        3DS authentication that resolves to `challenge`.


        An `outcome` of `successful` authenticates the attempt, which you can then pass as `three_ds_attempt_id` when

        simulating a card authorization. `failed` rejects the attempt. Both outcomes fire `issuing.3ds.authentication_completed`.'
      operationId: Cards_SimulateCompleteThreeDSChallenge
      parameters:
      - in: path
        name: three_ds_attempt_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateCompleteThreeDSChallengeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDSAttempt'
          description: Successful response
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      summary: Complete simulated 3DS challenge
      tags:
      - Cards
components:
  schemas:
    CardTransactionPointOfSaleDetails:
      properties:
        can_support_partial_approvals:
          description: Whether the terminal can support partial approvals
          type: boolean
        card_presence:
          description: 'The card presence. Possible values: `unknown`, `present`, `not_present`'
          enum:
          - unknown
          - present
          - not_present
          example: present
          type: string
        cardholder_presence:
          description: 'The cardholder presence. Possible values: `unknown`, `present`, `not_present`'
          enum:
          - unknown
          - present
          - not_present
          example: present
          type: string
        pan_entry_mode:
          description: 'The PAN entry mode. Possible values: `unknown`, `manual_entry`, `on_file`, `swipe`, `optical_code`, `reserved`, `contact_chip`, `contactless_chip`'
          enum:
          - unknown
          - manual_entry
          - on_file
          - swipe
          - optical_code
          - reserved
          - contact_chip
          - contactless_chip
          example: contactless_chip
          type: string
        terminal_type:
          description: 'Where the card was accepted: an `atm`, a merchant-staffed (`attended`) terminal, a self-service (`unattended`) terminal such as a fuel pump or kiosk, an online (`ecommerce`) checkout, or a `mail_telephone_order`. `unknown` is returned when the network did not identify it, including for merchant-initiated recurring and installment transactions. Possible values: `unknown`, `atm`, `attended`, `unattended`, `ecommerce`, `mail_telephone_order`'
          enum:
          - unknown
          - atm
          - attended
          - unattended
          - ecommerce
          - mail_telephone_order
          example: atm
          type: string
        transaction_initiator:
          description: 'The transaction initiator. Possible values: `unknown`, `cardholder`, `merchant`'
