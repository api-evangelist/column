          description: How did the cardholder cancel? Required when `cardholder_canceled` is `true`.
          example: The cardholder canceled by email to the merchant's support address.
          maxLength: 10000
          type: string
        cardholder_attempted_resolution:
          description: Whether the cardholder attempted to resolve the issue with the merchant. Required.
          type: boolean
        cardholder_attempted_return:
          description: Did the cardholder attempt to return the merchandise? Required when `delivered_late` is `true` and `cardholder_returned_merchandise` is `false`.
          type: boolean
        cardholder_canceled:
          description: Did the cardholder cancel before the expected receipt date? Defaults to `false` when omitted.
          type: boolean
        cardholder_returned_merchandise:
          description: Did the cardholder return the merchandise? Required when `delivered_late` is `true`.
          type: boolean
        commercial_virtual_account:
          description: Does the dispute involve a Visa Commercial Card Virtual Account? Only applies to services. Defaults to `false` when omitted.
          type: boolean
        delivered_late:
          description: Was the merchandise delivered late? Only applies to merchandise. Defaults to `false` when omitted.
          type: boolean
        delivered_to_wrong_location:
          description: Was the merchandise delivered to the incorrect location? Only applies to merchandise. Defaults to `false` when omitted.
          type: boolean
        dispute_before_expected_date_explanation:
          description: Why is the dispute being filed before the expected receipt date? Required while `expected_receipt_date` is in the future.
          example: The merchant confirmed the order was canceled and will not ship.
          maxLength: 10000
          type: string
        expected_receipt_date:
          description: The date the cardholder expected to receive the merchandise or services. Required.
          format: date
          type: string
        late_delivery_details:
          description: What was the address of the agreed location, or the details of the late delivery? Required when `delivered_late` or `delivered_to_wrong_location` is `true`.
          example: The merchandise was delivered three weeks after the agreed delivery date.
          maxLength: 10000
          type: string
        merchandise_or_services:
          allOf:
          - $ref: '#/components/schemas/CardDisputeMerchandiseOrServices'
          description: Whether the cardholder did not receive merchandise or services. Required.
        merchant_canceled:
          description: Did the merchant cancel the merchandise or services? Defaults to `false` when omitted.
          type: boolean
        merchant_cancellation_date:
          description: The date the merchant canceled the merchandise or services. Required when `merchant_canceled` is `true`.
          format: date
          type: string
        merchant_insolvent:
          description: Is the merchant insolvent or bankrupt? Defaults to `false` when omitted.
          type: boolean
        merchant_received_return_date:
          description: The date the merchant received the returned merchandise. Required when `cardholder_returned_merchandise` is `true`.
          format: date
          type: string
        non_fiat_currency_not_delivered:
          description: Was non-fiat currency or a non-fungible token not delivered to the destination wallet address the cardholder supplied at the time of the transaction? Only applies to services. Defaults to `false` when omitted.
          type: boolean
        order_details:
          description: What the cardholder purchased but did not receive. Required.
          example: A pair of running shoes ordered from the merchant's website.
          maxLength: 10000
          type: string
        resolution_prohibited_by_local_law:
          description: 'Is an attempt to resolve the dispute with the merchant prohibited by local law or regulations? Required when `cardholder_attempted_resolution` is `false`. Only `true` is accepted: the cardholder must attempt to resolve the dispute with the merchant unless local law prohibits it.'
          type: boolean
        returned_date:
          description: The date the cardholder returned the merchandise. Required when `cardholder_returned_merchandise` is `true`.
          format: date
          type: string
        third_party_gift_card:
          description: Is the purchase a third-party gift card without an expiration date, where the merchandise or services were not provided by the third party due to insolvency or bankruptcy? Defaults to `false` when omitted.
          type: boolean
        virtual_account_financial_loss:
