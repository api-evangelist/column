          pattern: ^ctxn_[0-9A-Za-z]{27}$
          type: string
        cardholder_narrative:
          description: Cardholder-provided narrative for the dispute.
          maxLength: 5000
          type: string
        currency:
          description: The cardholder billing currency.
          type: string
        evidence:
          description: Uploaded document evidence with normalized evidence types. An uploaded document is required for `counterfeit_merchandise`, `incorrect_amount` and `credit_not_processed` disputes, and for `duplicate_processing` and `paid_by_other_means` disputes whose payment proof is a document. A `cardholder_letter` document is required once the card already has two submitted disputes of the same reason against the same merchant within 30 days, for `merchandise_services_not_received` and `non_receipt_cash_at_atm`.
          items:
            $ref: '#/components/schemas/CardDisputeDocumentEvidenceInput'
          type: array
        evidence_document_ids:
          description: Legacy document IDs to use as evidence, uploaded via `POST /issuing/card-disputes/documents`. Documents uploaded via `POST /documents` are rejected.
          items:
            pattern: ^docu_[0-9A-Za-z]{27}$
            type: string
          type: array
        reason:
          allOf:
          - $ref: '#/components/schemas/CardDisputeReason'
          description: The reason for the dispute.
        reason_details:
          allOf:
          - $ref: '#/components/schemas/CardDisputeReasonDetails'
          description: Normalized reason-specific details for the dispute.
        reason_for_partial_dispute:
          description: Reason the cardholder is disputing less than the full transaction amount. Required for the dispute to be eligible when `amount` is less than the transaction amount, except for `incorrect_amount` disputes, which are partial by nature. Without it, eligibility reports `missing_required_evidence`.
          maxLength: 10000
          type: string
      required:
