          description: 'Optional description for the card program (max 255 characters).

            '
          maxLength: 255
          type: string
        jit_funding_enabled:
          description: 'Enables just-in-time funding of the program''s authorizations from the funding account your realtime

            authorization endpoint names. Only debit programs may enable it. Defaults to `false`.

            '
          type: boolean
        scheme:
          description: 'The card scheme for the program. Defaults to `visa` if not specified.

            '
          enum:
          - visa
          - mastercard
          type: string
        type:
          description: 'The type of card program to create.

            '
          enum:
          - credit
          - charge
          - debit
