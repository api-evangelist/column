    SimulateCardAuthorizationRequest:
      description: Request body for simulating a card authorization
      properties:
        cardholder_amount:
          description: 'Transaction amount in the merchant''s currency, expressed in the smallest currency unit.

            For example, 1000 represents 10.00 `EUR`. When `merchant_currency` is not `USD`,

            this amount is multiplied by `cardholder_fx_rate` to derive the `USD` billing amount.

            Must not exceed 999999999999.

            '
          example: 1000
          format: int64
          maximum: 999999999999
          type: integer
        cardholder_fx_rate:
          description: 'Foreign exchange rate to convert from merchant currency to `USD` (cardholder billing currency),

            as a decimal string. Required when `merchant_currency` is not `USD`.

            For example, if `merchant_currency` is `EUR` and `cardholder_fx_rate` is `"1.10"`,

            a 10.00 `EUR` transaction will result in an 11.00 `USD` cardholder charge.

            '
          example: '1.10'
          type: string
        cardholder_input:
          $ref: '#/components/schemas/SimulateCardholderInput'
        entry_mode:
          description: "How the card is presented to the merchant, which sets the simulated message's PAN entry mode (Field 22) and\nPOS condition code (Field 25). Use it to test card-present and card-not-present decisioning. Defaults to\n`swipe` for physical cards and `ecommerce` for virtual cards.\n\n- `swipe`: the physical card's magnetic stripe is read at an attended terminal. The message carries the\n  card's track data, which Column verifies.\n- `keyed`: the physical card's number is typed into the terminal by hand. The message carries no track\n  data, and carries the card's CVV2.\n- `ecommerce`: the card is used at an online checkout. The message carries no track data, and carries the\n  card's CVV2.\n\nVirtual cards only support `ecommerce`, and `cardholder_input.pin` is not supported with `ecommerce`.\nChip and contactless entry are not supported, because they need an EMV cryptogram the simulator cannot\ngenerate under sandbox card keys.\n"
          enum:
          - swipe
          - keyed
          - ecommerce
          example: keyed
          type: string
        merchant_category_code:
          description: 'Optional merchant category code (ISO 18245 MCC) to put on the simulated message (Field 18), for

            example `5812` (restaurants) or `6011` (ATM). Defaults to `5999`. Use it to exercise real-time

            decisioning rules that depend on the merchant category.

            '
          example: '5812'
          pattern: ^[0-9]{4}$
          type: string
        merchant_city:
          description: 'Optional card acceptor city to put on the simulated message (Field 43, positions 26-38).

            Defaults to `CITY NAME`. At most 13 characters.

            '
          example: OAKLAND
          maxLength: 13
          pattern: ^[ -~]*$
          type: string
        merchant_country_code:
          description: 'Optional card acceptor country, ISO 3166-1 alpha-2, to put on the simulated message (Field 43,

            positions 39-40). Defaults to `US`. Use it to exercise country-based decisioning rules.

            '
          example: CA
          pattern: ^[A-Z]{2}$
          type: string
        merchant_currency:
          description: 'Merchant''s currency code in ISO 4217 format.

            '
          example: EUR
          type: string
        merchant_name:
          description: 'Optional card acceptor name to put on the simulated message (Field 43, positions 1-25).

            Defaults to `ACQUIRER NAME`. At most 25 characters.

            '
          example: BLUE BOTTLE COFFEE
          maxLength: 25
          pattern: ^[ -~]*$
          type: string
        network_decision_reason:
          description: 'The reason for the network''s decline decision. Only applicable when

            `network_standin` is `declined`. Determines the network response code

            on the transaction. Defaults to `generic_decline` if not specified.

            '
          example: insufficient_funds
          type: string
        network_standin:
          description: 'Simulates a scenario where the card network makes the authorization decision

            on behalf of the issuer (e.g., due to issuer timeout). When set, the resulting

            transaction will have `decision_source` set to `card_network`.


            - `approved` — the network approves the transaction.

            - `declined` — the network declines the transaction.

            '
          enum:
          - approved
          - declined
          type: string
        realtime_decision:
          description: "Specifies the issuer's real-time authorization decision to inject if the transaction\nreaches the real-time decisioning step. Mutually exclusive with `network_standin`.\n\n- `approve` — the issuer approves the transaction.\n- `decline` — the issuer declines the transaction (see `realtime_decision_reason`).\n- `partially_approve` — the issuer partially approves the transaction\n  (requires `realtime_partially_approved_amount`).\n\nWhen neither `realtime_decision` nor `network_standin` is provided, the simulator\nattempts a real real-time authorization decision webhook to the platform's configured\n`decision.issuing.card_transaction` destination (declining if no destination is configured).\n"
          enum:
          - approve
          - decline
          - partially_approve
          type: string
        realtime_decision_reason:
          description: 'The reason for the issuer''s real-time decline decision. Only applicable when

            `realtime_decision` is `decline`. Defaults to `generic_decline` if not specified.

            '
          example: insufficient_funds
          type: string
        realtime_funding_account_id:
          description: 'The bank account to just-in-time fund the authorization from, as a platform''s real-time authorization

            decision would name in `funding_account_id`. Only applicable when `realtime_decision` is `approve` or

            `partially_approve`, and only on debit card programs with `jit_funding_enabled`.

            '
          example: bacc_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^bacc_[0-9A-Za-z]{27}$
          type: string
        realtime_partially_approved_amount:
          description: 'The amount to partially approve, in the smallest unit of the cardholder billing currency (`USD`).

            Required when `realtime_decision` is `partially_approve`, and must be less than the amount

            billed to the cardholder: `cardholder_amount` when `merchant_currency` is `USD`, or

            `cardholder_amount` converted at `cardholder_fx_rate` otherwise.

            '
          example: 50
          format: int64
          maximum: 999999999999
          type: integer
        three_ds_attempt_id:
          description: 'Optional 3DS attempt ID to link to this authorization. The 3DS attempt must be in

            `authenticated` status and belong to the same card. When provided, the authorization

            will include authentication details with liability shift.

            '
          example: tdsa_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^tdsa_[0-9A-Za-z]{27}$
          type: string
      required:
      - cardholder_amount
      - merchant_currency
      type: object
