      - card_id
      - card_account_id
      - card_program_id
      - status
      - wallet_type
      - created_at
      type: object
    SimulateCardholderInput:
      description: 'What the cardholder enters at the terminal or online checkout. Column''s real verification checks each input

        against the card, so the outcome is the one a real transaction would get.

        '
      properties:
        billing_address:
          $ref: '#/components/schemas/SimulateCardholderBillingAddress'
        cvv2:
          description: "The CVV2 the cardholder types at an online checkout or a keyed terminal, as 3 or 4 digits. Column verifies it\nagainst the card's CVV2.\n\n- The CVV2 matches: CVV2 verification passes and the transaction continues to decisioning.\n- The CVV2 doesn't match: the transaction is declined with `decision_reason` `invalid_cvv2` and\n  `decision_source` `column`.\n\nOnly supported when the card is keyed or used online: `entry_mode` `keyed` or `ecommerce`, which is a virtual\ncard's default. A swiped card, a physical card's default, carries no CVV2, so `cvv2` is rejected. When\nomitted, a keyed or online transaction carries the card's real CVV2.\n"
          example: '123'
          maxLength: 4
          minLength: 3
          pattern: ^[0-9]{3,4}$
          type: string
        expiration_date:
          $ref: '#/components/schemas/SimulateCardholderExpirationDate'
        pin:
          description: "The PIN the cardholder types on the terminal's PIN pad, as 4 to 12 digits in plaintext. Sandbox only: the\nsimulator encrypts it the way a terminal would, and Column verifies it against the card's PIN.\n\n- The PIN matches: PIN verification passes and the transaction continues to decisioning.\n- The PIN doesn't match: the transaction is declined with `decision_reason` `pin_invalid` and\n  `decision_source` `column`. 3 wrong PINs in a row block the card's PIN.\n- The card has no PIN set: declined with `pin_not_set`.\n- The card's PIN is blocked: declined with `pin_blocked`, whatever the PIN, until you unblock it with\n  `POST /issuing/cards/{card_id}/pin/unblock`.\n\nNot supported for virtual cards, which have no terminal.\n"
          example: '1234'
          maxLength: 12
          minLength: 4
          pattern: ^[0-9]{4,12}$
          type: string
      type: object
    CardTransaction:
      description: The card transaction object represents a transaction made with a card.
      properties:
        authentication_details:
          allOf:
          - $ref: '#/components/schemas/CardTransactionAuthenticationDetails'
          description: 3D Secure authentication details
        authorization_expires_at:
          description: The authorization expiration date of the card transaction. Funds will be released from any authorization after this date
          format: date-time
          type:
          - string
          - 'null'
        card_acceptor_details:
          allOf:
          - $ref: '#/components/schemas/CardTransactionCardAcceptorDetails'
          description: Information about the entity that accepted the card
        card_account_id:
          description: The ID of the card account
          example: cacc_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^cacc_[0-9A-Za-z]{27}$
          type: string
        card_id:
          description: The ID of the card
          example: card_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^card_[0-9A-Za-z]{27}$
          type: string
        card_program_id:
          description: The ID of the card program
          example: cpgm_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^cpgm_[0-9A-Za-z]{27}$
          type: string
        card_token_id:
          description: The card token used for this transaction, if applicable.
          example: ctkn_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^ctkn_[0-9A-Za-z]{27}$
          type:
          - string
          - 'null'
        cardholder_verification_details:
          allOf:
          - $ref: '#/components/schemas/CardTransactionCardholderVerificationDetails'
          description: Cardholder identity verification results for name, email, phone, and address
        created_at:
          description: The creation date of the card transaction
          format: date-time
          type: string
        events:
          description: The events associated with the card transaction
          items:
            $ref: '#/components/schemas/CardTransactionEvent'
          type: array
        fee_details:
          allOf:
          - $ref: '#/components/schemas/CardTransactionFeeDetails'
          description: Fee-related transaction details
        funding_details:
          allOf:
          - $ref: '#/components/schemas/CardTransactionFundingDetails'
          description: Just-in-time funding of the authorization, present only when the platform funded its shortfall
        id:
          description: The ID of the card transaction
          example: ctxn_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^ctxn_[0-9A-Za-z]{27}$
          type: string
        network_details:
          allOf:
          - $ref: '#/components/schemas/CardTransactionNetworkDetails'
          description: Identifiers used by the associated card network
        network_transaction_id:
          description: The transaction ID assigned by the card network
          example: '305123456789012'
          type:
          - string
          - 'null'
        original_card_transaction_id:
          description: The ID of the original card transaction referenced by the transaction
          example: ctxn_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^ctxn_[0-9A-Za-z]{27}$
          type:
          - string
          - 'null'
        point_of_sale_details:
          allOf:
          - $ref: '#/components/schemas/CardTransactionPointOfSaleDetails'
          description: The point of sale details
        recurring_transaction_details:
          allOf:
          - $ref: '#/components/schemas/CardTransactionRecurringTransactionDetails'
          description: Recurring transaction details
        total_amounts:
          allOf:
          - $ref: '#/components/schemas/CardTransactionTotalAmounts'
          description: The total transaction amounts (simple sum of all transaction event amounts)
        transaction_details:
          allOf:
          - $ref: '#/components/schemas/CardTransactionTransactionDetails'
          description: Additional transaction-specific level 3 details (lodging, account funding, original credit, invoice, travel, fleet)
        type:
          description: 'The kind of card transaction, set from the card network processing code when the transaction is created. Unlike `event_type`, which describes each step of the transaction lifecycle, the type does not change. Combine it with `point_of_sale_details.terminal_type` to distinguish, for example, an ATM withdrawal (`cash_withdrawal` at an `atm`) from a cash advance at a bank teller. `unknown` is returned when the network did not identify the kind. Possible values: `unknown`, `purchase`, `cash_withdrawal`, `quasi_cash`, `account_funding`, `bill_payment`, `adjustment`, `refund`, `original_credit`, `balance_inquiry`, `account_verification`'
          enum:
          - unknown
          - purchase
          - cash_withdrawal
          - quasi_cash
          - account_funding
          - bill_payment
          - adjustment
          - refund
          - original_credit
          - balance_inquiry
          - account_verification
          example: purchase
          type: string
      required:
      - id
      - card_program_id
      - card_account_id
      - card_id
      - total_amounts
      - type
      - created_at
      type: object
    SimulateStepUpMethodsResponse:
      description: 'Response body for the simulate step-up retrieve-methods endpoint. Lists the step-up

        authentication methods available to the cardholder based on the contact info on file.

        '
      properties:
        step_up_methods:
          description: 'The available step-up authentication methods. Empty when the cardholder has no contact

            info on file.

            '
          items:
            $ref: '#/components/schemas/SimulateStepUpMethod'
          type: array
      required:
      - step_up_methods
      type: object
    ListCardDisputesResponse:
      properties:
        card_disputes:
          description: List of card disputes.
          items:
            $ref: '#/components/schemas/CardDispute'
          type: array
        has_more:
          description: Whether more card disputes are available.
          type: boolean
      required:
      - card_disputes
      - has_more
      type: object
    ListCardProgramsResponse:
      properties:
        card_programs:
          description: List of card programs
          items:
            $ref: '#/components/schemas/CardProgram'
          type: array
        has_more:
          description: Whether more card programs are available
          type: boolean
      required:
      - card_programs
      - has_more
      type: object
    CardTransactionFeeDetails:
      description: Fee-related transaction details including the consolidated transaction fee amount when available.
      properties:
        transaction_fee_amount:
          description: The transaction fee amount in the smallest unit of the currency
          format: int64
          type:
          - integer
          - 'null'
        transaction_fee_currency:
          description: The currency code of the transaction fee
          example: USD
          pattern: ^[A-Z]{3}$
          type:
          - string
          - 'null'
      type: object
    CardDisputeIncorrectCurrencyReasonDetails:
      properties:
        cardholder_did_not_agree_to_dcc:
          description: 'Does the issuer certify that the cardholder did not agree to dynamic currency conversion and did not make an active choice? Required when `currency_error` is `dynamic_currency_conversion`. Must be true: `false` would certify the cardholder agreed to the conversion the dispute claims they did not.'
          type: boolean
        correct_currency:
          description: What currency should the transaction have been processed in? Required when `currency_error` is `currency_difference`. Must differ from the currency the merchant processed the transaction in.
          example: USD
          type: string
        currency_error:
          allOf:
          - $ref: '#/components/schemas/CardDisputeCurrencyError'
          description: What was wrong with the transaction currency? Required.
      type: object
    CardDisputeWorkflow:
      description: The Visa dispute workflow a dispute follows, selected by its dispute reason. Collaboration disputes negotiate through chargeback, representment, and pre-arbitration; allocation disputes cover fraud-related claims the acquirer responds to directly.
      enum:
      - collaboration
      - allocation
      type: string
    CreateCardDisputeRequest:
      properties:
        amount:
          description: The dispute amount in smallest currency unit.
          format: int64
          type: integer
        card_transaction_id:
          description: The ID of the card transaction to dispute.
          pattern: ^ctxn_[0-9A-Za-z]{27}$
          type: string
        cardholder_narrative:
          description: Cardholder-provided narrative for the dispute.
          maxLength: 5000
          type: string
        currency:
          description: The cardholder billing currency.
          type: string
        evidence:
          description: Uploaded document evidence with normalized evidence types. An uploaded document is required for `counterfeit_merchandise`, `incorrect_amount` and `credit_not_processed` disputes, and for `duplicate_processing` and `paid_by_other_means` disputes whose payment proof is a document. A `cardholder_letter` document is required once the card already has two submitted disputes of the same reason against the same merchant within 30 days, for `merchandise_services_not_received` and `non_receipt_cash_at_atm`.
          items:
            $ref: '#/components/schemas/CardDisputeDocumentEvidenceInput'
          type: array
        evidence_document_ids:
          description: Legacy document IDs to use as evidence, uploaded via `POST /issuing/card-disputes/documents`. Documents uploaded via `POST /documents` are rejected.
          items:
            pattern: ^docu_[0-9A-Za-z]{27}$
            type: string
          type: array
        issue_provisional_credit:
          description: 'Whether to issue a provisional credit for the dispute. Credit will be applied from the card program''s

            operating account. Not supported for `original_credit_not_accepted` disputes, which return funds the

            cardholder received. While the dispute is a draft, the credit can also be issued or removed later via

            `/issuing/card-disputes/{card_dispute_id}/provisional-credit`.

            '
          type: boolean
        reason:
          allOf:
          - $ref: '#/components/schemas/CardDisputeReason'
          description: The reason for the dispute.
        reason_details:
          allOf:
          - $ref: '#/components/schemas/CardDisputeReasonDetails'
          description: Normalized reason-specific details for the dispute.
        reason_for_partial_dispute:
          description: 'Reason the cardholder is disputing less than the full transaction amount. Required at submission when `amount` is less than the transaction amount, except for `incorrect_amount` disputes, which are partial by nature: for those the value is stored but never required or sent to the network.'
          maxLength: 10000
          type: string
        submit:
          description: Whether to queue the dispute for network submission immediately.
          type: boolean
      required:
      - card_transaction_id
      - amount
      - currency
      - reason
      type: object
    CardDisputeIncorrectTransactionCodeReasonDetails:
      description: Details for an incorrect-transaction-code dispute. The dispute amount must be less than the transaction amount.
      properties:
        credit_card_transaction_id:
          description: Which card transaction is the credit the merchant processed instead of a reversal or adjustment? Required when `transaction_code_error` is `credit_instead_of_reversal`. It must be a credit on the same card account as the disputed transaction and carry a Visa transaction identifier.
          example: ctxn_3y9htaz6gomqB0t1UPDtfF0BCEN
          pattern: ^ctxn_[0-9A-Za-z]{27}$
          type: string
        credit_error_explanation:
          description: Why was the credit refund processed in error? Required when `transaction_code_error` is `credit_instead_of_reversal`.
          example: The merchant processed a credit instead of reversing the original charge.
          maxLength: 10000
          type: string
        transaction_code_error:
          allOf:
          - $ref: '#/components/schemas/CardDisputeTransactionCodeError'
          description: How was the transaction code incorrect? Required.
      type: object
    CardDisputeFraudReasonDetails:
      properties:
        card_mailed_date:
          description: The date the card was mailed to the cardholder. Required when `fraud_type` is `card_not_received_as_issued`.
          format: date
          type: string
        card_mailed_postal_code:
          description: The postal code the card was mailed to, at most 9 characters (for example `94107`, or `941071234` for a ZIP+4 code). Required when `fraud_type` is `card_not_received_as_issued`.
          example: '94107'
          maxLength: 9
          type: string
        fraud_type:
          description: 'The cardholder-reported fraud subtype. Required. `acquirer_reported`, `merchant_misrepresentation` and `manipulation_of_account_holder` are retired: they can appear on disputes created before they were retired, but are rejected when creating a dispute, checking eligibility, or adding reason details. Visa reserves `acquirer_reported` for acquirers, and a fraud dispute certifies that the cardholder denies authorizing or participating in the transaction, so file a scam the cardholder took part in under a consumer dispute reason instead.'
          enum:
          - lost
          - stolen
          - card_not_received_as_issued
          - fraudulent_application
          - counterfeit
          - miscellaneous_account_takeover
          - card_absent
          - acquirer_reported
          - incorrect_processing
          - account_or_credentials_takeover
          - merchant_misrepresentation
          - manipulation_of_account_holder
          type: string
        pin_preferring_card:
          description: Whether the card is a PIN-preferring chip card. Only used when `fraud_type` is `lost`, `stolen` or `card_not_received_as_issued`, and treated as `false` for a card without a chip. When omitted, Visa assumes `false`.
          type: boolean
      type: object
    CardDispute:
      properties:
        allowed_close_resolutions:
          description: Close resolutions Column will currently accept via POST /close, given the dispute's stage, workflow, and network state. Empty when no new close is possible.
          items:
            $ref: '#/components/schemas/CardDisputeCloseResolution'
          type: array
        allowed_response_actions:
          description: Response actions Column will currently accept via POST /respond, given the dispute's stage, workflow, and network state. Empty when no response is possible.
          items:
            $ref: '#/components/schemas/CardDisputeResponseAction'
          type: array
        amount:
          description: The dispute amount in smallest currency unit
          format: int64
          type: integer
        card_account_id:
          description: The ID of the card account
          type: string
        card_program_id:
          description: The ID of the card program
          type: string
        card_transaction_id:
          description: The ID of the card transaction
          type: string
        compelling_evidence_certification_required:
          description: Whether POST /respond currently requires `compelling_evidence_reviewed_with_cardholder` and `cardholder_name_and_address_mismatch`. True while you can decline or partially accept a fraud pre-arbitration in which the acquirer presented compelling evidence.
          type: boolean
        created_at:
          description: When the dispute was created
          format: date-time
          type: string
        currency:
          description: The currency code
          type: string
        events:
          description: The dispute events
          items:
            $ref: '#/components/schemas/CardDisputeEvent'
          type: array
        evidence:
          description: The dispute evidence.
          items:
            $ref: '#/components/schemas/CardDisputeEvidence'
          type: array
        id:
          description: The ID of the card dispute
          example: cdsp_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^cdsp_[0-9A-Za-z]{27}$
          type: string
        last_network_sync_at:
          description: When Column last synchronized the dispute's state from the network. This reflects Column's own sync job, not a live network read; refreshing the page does not force a new synchronization.
          format: date-time
          type:
          - string
          - 'null'
        next_actions:
          description: Customer-visible next actions for the dispute.
          items:
            $ref: '#/components/schemas/CardDisputeNextAction'
          type: array
        platform_id:
          description: The ID of the platform
          type: string
        provisional_credit:
          description: 'Whether a provisional credit has been issued for this dispute. Removing the credit while the dispute is a draft clears the flag. Otherwise it records credit issuance history: a reversal after the dispute is closed does not clear the flag, so outside of drafts it is not an indicator of a current outstanding credit balance.'
          type: boolean
        reason:
          allOf:
          - $ref: '#/components/schemas/CardDisputeReason'
          description: The reason for the dispute
        reason_details:
          allOf:
          - $ref: '#/components/schemas/CardDisputeReasonDetails'
          description: Normalized reason-specific details for the dispute.
        reason_for_partial_dispute:
          description: Explanation of why the cardholder is disputing less than the full transaction amount, stored when the claim is partial. Not used for `incorrect_amount` disputes.
          type:
          - string
          - 'null'
        requested_resolution:
          allOf:
          - $ref: '#/components/schemas/CardDisputeCloseResolution'
          description: Close resolution queued for a submitted dispute awaiting network recall, distinguishing saved close intent from a request the server never received.
          type:
          - string
          - 'null'
        resolution_reason:
          description: The resolution reason for the dispute
          enum:
          - merchant_accepted
          - rapid_dispute_resolution
          - arbitration_network_ruling
          - issuer_liability
          - exceeded_filing_date
          - customer_accepted_liability
          example: null
          type:
          - string
          - 'null'
        respond_by:
          description: The date by which the next network action is due.
          format: date
          type: string
        stage:
          description: The current stage of the dispute
          enum:
          - initiated
          - disputed
          - merchant_responded
          - merchant_response_recalled
          - prearbitration
          - prearbitration_responded
          - arbitration
          - dispute_won
          - dispute_close
          example: disputed
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/CardDisputeStatus'
          description: The public status of the dispute.
        submission_error:
          description: The most recent network submission error. Populated only when submission_status is failed; never set for requires_action, which is a normal state in which the network is awaiting the platform's response.
          example: null
          type:
          - string
          - 'null'
        submission_status:
          description: The dispute network submission status.
          enum:
          - not_required
          - draft
          - pending_submission
          - submitted
          - requires_action
          - failed
          example: submitted
          type: string
        submitted_at:
          description: When the dispute was submitted to the network. Null while the dispute has never been sent, including drafts and queued submissions.
          format: date-time
          type:
          - string
          - 'null'
        updated_at:
          description: When the dispute was last updated
          format: date-time
          type: string
        workflow:
          allOf:
          - $ref: '#/components/schemas/CardDisputeWorkflow'
          description: The Visa dispute workflow the dispute follows. Collaboration disputes negotiate through chargeback, representment, and pre-arbitration; allocation disputes cover fraud-related claims the acquirer responds to directly.
      required:
      - id
      - platform_id
      - card_program_id
      - card_account_id
      - card_transaction_id
      - stage
      - reason
      - workflow
      - currency
      - amount
      - status
      - submission_status
      - allowed_response_actions
      - allowed_close_resolutions
      - compelling_evidence_certification_required
      - provisional_credit
      - next_actions
      - created_at
      - updated_at
      - events
      - evidence
      type: object
    CardTransactionEventAmounts:
      properties:
        cardholder_authorized:
          allOf:
          - $ref: '#/components/schemas/CardTransactionEventAmount'
          description: The amount authorized and being held in the cardholder's currency
