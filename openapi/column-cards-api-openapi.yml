          - string
          - 'null'
        status:
          description: The status of the card token
          enum:
          - pending_activation
          - stepping_up
          - pending_authentication
          - activation_denied
          - active
          - paused
          - deactivated
          example: active
          type: string
        stepping_up_at:
          description: Timestamp when the token entered `stepping_up` status
          format: date-time
          type:
          - string
          - 'null'
        token_type:
          description: 'The type of token. Possible values: `wallet`, `card_on_file`'
          enum:
          - wallet
          - card_on_file
          example: wallet
          type:
          - string
          - 'null'
        wallet_type:
          description: 'The type of digital wallet. Possible values: `apple_pay`, `google_pay`, `samsung_pay`, `unknown`'
          enum:
          - apple_pay
