          example: The cardholder withdrew the dispute after the merchant issued a refund.
          maxLength: 5000
          type: string
        resolution:
          allOf:
          - $ref: '#/components/schemas/CardDisputeCloseResolution'
          description: Whether the platform accepts the cardholder's claim and assumes liability, or the cardholder withdrew the claim.
      required:
      - resolution
      type: object
    CardDisputeOtherPaymentProof:
      description: 'The proof that the merchant was paid by other means: the other transaction''s acquirer reference number or Visa transaction identifier when it was paid with another issuer''s Visa card, or a cash receipt, cancelled check, third-party voucher, statement from the other card, or other document.'
      enum:
      - acquirer_reference_number
      - network_transaction_id
      - cash_receipt
      - cancelled_check
      - third_party_voucher
      - other_card_statement
      - other
      type: string
    Address:
      description: A physical address
      properties:
        city:
          description: City name
          maxLength: 255
          type: string
        country_code:
          description: Two-letter ISO 3166-1 alpha-2 country code (e.g. `US`)
          maxLength: 3
          type: string
        line_1:
          description: Street address line 1
          maxLength: 255
          type: string
        line_2:
          description: Street address line 2
          maxLength: 255
          type: string
        postal_code:
          description: Postal or ZIP code
          maxLength: 24
          type: string
        state:
          description: State or province
          maxLength: 255
          type: string
      required:
      - line_1
