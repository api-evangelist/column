      - refused_accept_returned_merchandise
      - advised_not_to_return
      - no_longer_exists_or_not_responding
      - did_not_provide_clear_return_instructions
      type: string
    SimulateSendPasscodeResponse:
      description: 'Response body for the simulate step-up send-passcode endpoint. Reports the simulated passcode

        delivered via the `issuing.card_token.send_passcode` webhook and the card token after the step-up

        transitions.

        '
      properties:
        card_token:
          $ref: '#/components/schemas/CardToken'
        otp_method_identifier:
          description: Identifier of the step-up method the passcode was delivered to.
          example: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
          type: string
        otp_method_type:
          description: 'The resolved method type the passcode was delivered to (`sms` or `email`). Empty when the

            identifier could not be resolved from the token''s persisted step-up map.

            '
          example: sms
          type: string
        passcode:
          description: The simulated one-time passcode delivered to the cardholder via the webhook.
          example: '123456'
          type: string
      required:
      - card_token
      - passcode
      - otp_method_identifier
      - otp_method_type
      type: object
    CardDisputePaidByOtherMeansReasonDetails:
      description: Details for a paid-by-other-means dispute. `cash_receipt`, `cancelled_check`, `other_card_statement` and `other` proofs, and a `third_party_voucher` with `merchant_passed_on_funds_evidence`, require an uploaded document before submission.
      properties:
        cardholder_attempted_resolution:
          description: Did the cardholder attempt to resolve the dispute with the merchant? Required.
          type: boolean
        merchant_passed_on_funds_evidence:
          description: Does the issuer have evidence that the first merchant passed on the funds to the second merchant? Required when `other_payment_proof` is `third_party_voucher`. Visa blocks the dispute unless it does, so `false` is rejected.
          type: boolean
        other_acquirer_reference_number:
          description: What is the other transaction's acquirer reference number? Required when `other_payment_proof` is `acquirer_reference_number`. 23 or 24 digits.
          pattern: ^([0-9]{23}|[0-9]{24})$
          type: string
        other_card_transaction_id:
          description: Which card transaction is the other payment? Required when `other_transaction_on_same_card` or `other_transaction_on_different_card` is true. It must belong to this platform, be on the same card number as the disputed transaction when `other_transaction_on_same_card` is true and on a different card number otherwise, and carry a Visa transaction identifier.
          example: ctxn_3y9htaz6gomqB0t1UPDtfF0BCEN
          pattern: ^ctxn_[0-9A-Za-z]{27}$
          type: string
        other_network_transaction_id:
          description: What is the other transaction's Visa transaction identifier? Required when `other_payment_proof` is `network_transaction_id`. 15 digits, or 17 with a multiple clearing sequence number.
          example: '305123456789012'
          pattern: ^([0-9]{15}|[0-9]{17})$
          type: string
        other_payment_proof:
          allOf:
          - $ref: '#/components/schemas/CardDisputeOtherPaymentProof'
          description: What proof of the payment by other means is available? Required when `other_transaction_paid_by_other_means` is true.
        other_transaction_on_different_card:
          description: Is the other transaction for the same merchant and on a different Visa card of the same cardholder? Required when `other_transaction_on_same_card` is false.
          type: boolean
        other_transaction_on_same_card:
          description: Are both transactions for the same merchant and on the same card? Required. A renewed or damaged-card replacement that keeps the card number is the same card.
          type: boolean
        other_transaction_paid_by_other_means:
          description: Was the other transaction paid by other means? Required when the other transaction is on neither card. Visa blocks the dispute unless it was, so `false` is rejected.
          type: boolean
        resolution_prohibited_by_local_law:
          description: Is an attempt to resolve the dispute with the merchant prohibited by local law or regulations? Required when `cardholder_attempted_resolution` is false. Visa blocks the dispute unless it is, so `false` is rejected.
          type: boolean
      type: object
    ListCardsResponse:
      properties:
        cards:
          description: List of cards
          items:
            $ref: '#/components/schemas/Card'
          type: array
        has_more:
          description: Whether more cards are available
          type: boolean
      required:
      - cards
      - has_more
      type: object
    CardTokenProvisioningDecisioningDetails:
      properties:
        decision:
          description: The provisioning decision
          enum:
          - approve
          - decline
          - step_up
          type: string
        decision_source:
          description: The party that made the provisioning decision
          enum:
          - column
          - platform_owner
          type: string
        rejection_reason:
          description: The reason the provisioning request was rejected. Only set when the decision is decline.
          enum:
          - card_paused
          - card_inactive
          - card_deactivated
          - card_not_found
          - card_expired
          - customer_timeout
          - customer_connection_error
          - customer_invalid_response
          - no_realtime_endpoint_defined
          - generic_decline
          - internal_error
          type:
          - string
          - 'null'
      required:
      - decision
      - decision_source
      type: object
    CreateCardRequest:
      properties:
        authorized_user_entity_id:
          description: The ID of the person entity authorized to use this card
          type: string
        card_account_id:
          description: The ID of the card account to create the card under
          type: string
        card_authorization_policy_id:
          description: Optional card authorization policy ID for the card
          type: string
        card_template_id:
          description: Optional card template ID to use for the card. The template must belong to the card account's card program
          example: ctmp_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^ctmp_[0-9A-Za-z]{27}$
          type: string
        description:
          description: Optional description for the card
          maxLength: 255
          type: string
        encrypted_pin:
          description: 'Debit card programs only. Base64-encoded encrypted PIN. Omit to create the card without a PIN; the card''s `pin_status` is `unset`, and transactions that require a PIN decline with `pin_not_set` until you set one with `PATCH /issuing/cards/{card_id}/pin`. To have Column choose the PIN instead, omit this and pass `generate_pin`. Treat an encrypted PIN like the PIN itself: never log, store, or reuse it.

            '
          type: string
        expiration_month:
          description: Optional expiration month (1-12)
          example: 12
          type: integer
        expiration_year:
          description: Optional expiration year (4-digit year, e.g. 2025)
          example: 2029
          type: integer
        generate_pin:
          description: 'Debit card programs with PIN reveal enabled only. Pass `true` to have Column set a random 4-digit PIN on the card instead of providing `encrypted_pin`, which must then be omitted. The card''s `pin_status` is `set`. The PIN is never returned in the response; the cardholder learns it through PIN reveal.

            '
          type: boolean
        shipping_details:
          allOf:
          - $ref: '#/components/schemas/ShippingDetails'
          description: Shipping address and contact information for physical card delivery. Required when type is physical
        status:
          description: Optional initial status for the card
          example: active
          type: string
        type:
          description: 'The form factor of the card. Possible values: `virtual`, `physical`.'
          example: physical
          type: string
      required:
      - type
      - authorized_user_entity_id
      - card_account_id
      type: object
    CardAuthorizationPolicy:
      description: The config object contains the rules and limits that define what transactions are allowed or blocked.
      properties:
        allowed_merchant_category_codes:
          description: List of allowed merchant category codes (MCCs). If specified, only transactions with these MCCs will be allowed
          example:
          - '5411'
          - '5912'
          items:
            type: string
          type: array
        allowed_merchant_country_codes:
          description: List of allowed merchant country codes. If specified, only transactions from these countries will be allowed
          items:
            type: string
          type: array
        allowed_merchant_currency_codes:
          description: List of allowed merchant currency codes. If specified, only transactions in these currencies will be allowed
          example:
          - USD
          items:
            type: string
          type: array
        allowed_merchant_ids:
          description: List of allowed merchant identifiers. If specified, only transactions from these specific merchants will be allowed. Each identifier must be ASCII and at most 15 characters
          items:
            type: string
          type: array
        blocked_merchant_category_codes:
          description: List of blocked merchant category codes (MCCs). Transactions with these MCCs will be declined
          example:
          - '7995'
          items:
            type: string
          type: array
        blocked_merchant_country_codes:
          description: List of blocked merchant country codes. Transactions from these countries will be declined
          items:
            type: string
          type: array
        blocked_merchant_currency_codes:
          description: List of blocked merchant currency codes. Transactions in these currencies will be declined
          example:
          - EUR
          items:
            type: string
          type: array
        blocked_merchant_ids:
          description: List of blocked merchant identifiers. Transactions from these specific merchants will be declined. Each identifier must be ASCII and at most 15 characters
          items:
            type: string
          type: array
        card_spend_policies:
          description: List of spend policies that define volume and frequency limits
          items:
            $ref: '#/components/schemas/CardSpendPolicy'
          type: array
      type: object
    CreateCardAuthorizationPolicyVersionRequest:
      properties:
        card_authorization_policy_id:
          description: The ID of the parent card authorization policy
          example: caup_2x8gszy5folpA9s0TOCseE9ABDM
          pattern: ^caup_[0-9A-Za-z]{27}$
          type: string
        config:
          allOf:
          - $ref: '#/components/schemas/CardAuthorizationPolicy'
          description: Policy configuration
        effective_on:
          description: When the policy version becomes effective, as an RFC 3339 timestamp. Offsets are converted to UTC and fractional seconds are dropped.
          format: date-time
          type: string
        scope:
          description: The scope of this authorization policy (program, account, or card). Must match the scope of the policy's existing versions.
          enum:
          - card_program
          - card_account
          - card
          type: string
      required:
      - card_authorization_policy_id
      - scope
      - effective_on
      - config
      type: object
    CardDisputeReservationCertification:
      description: 'What the cardholder certifies about a canceled guaranteed reservation: `properly_canceled` (the cardholder properly canceled the guaranteed reservation), `attempted_cancellation_within_24_hours` (the cardholder attempted to cancel within 24 hours of delivery of the reservation confirmation) or `no_show_billed_for_more_than_one_day` (the merchant billed a no-show transaction for more than one day''s accommodation or rental).'
      enum:
      - properly_canceled
      - attempted_cancellation_within_24_hours
      - no_show_billed_for_more_than_one_day
      type: string
    CloseCardDisputeRequest:
      properties:
